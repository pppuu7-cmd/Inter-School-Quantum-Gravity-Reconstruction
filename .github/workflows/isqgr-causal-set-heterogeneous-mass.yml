name: ISQGR Causal-Set Heterogeneous Mass Composition

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/isqgr-causal-set-heterogeneous-mass.yml'
      - 'experiments/causal_set_heterogeneous_mass_composition.py'

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        n: [384, 512, 768]
        seed: [91, 92]
        pair:
          - '0.0,0.01'
          - '0.01,0.0'
          - '0.01,0.03'
          - '0.03,0.01'
          - '0.0,0.03'
          - '0.03,0.0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip numpy scipy
      - name: Run heterogeneous mass composition
        run: |
          MU1="${{ matrix.pair }}"; MU1="${MU1%%,*}"
          MU2="${{ matrix.pair }}"; MU2="${MU2##*,}"
          python experiments/causal_set_heterogeneous_mass_composition.py \
            --n ${{ matrix.n }} --seed ${{ matrix.seed }} --mu1 "$MU1" --mu2 "$MU2" --n-random 24 \
            --output "compute_out/n${{ matrix.n }}_s${{ matrix.seed }}_${MU1}_${MU2}.json"
      - uses: actions/upload-artifact@v4
        with:
          name: causal-hetero-${{ matrix.n }}-${{ matrix.seed }}-${{ strategy.job-index }}
          path: compute_out/*.json
          if-no-files-found: error

  aggregate:
    if: always()
    needs: [benchmark]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: campaign
          merge-multiple: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Aggregate
        run: |
          python - <<'PY'
          import json,pathlib,statistics
          rows=[json.loads(p.read_text()) for p in pathlib.Path('campaign').glob('*.json')]
          by_pair={}
          for pair in sorted({(r['mu1'],r['mu2']) for r in rows}):
              g=[r for r in rows if (r['mu1'],r['mu2'])==pair]
              by_pair[f'{pair[0]}->{pair[1]}']={
                'n':len(g),
                'mean_operator_difference':statistics.fmean(x['operator_relative_difference'] for x in g),
                'mean_return_improvement':statistics.fmean(x['improvement']['random_mean_over_source_return'] for x in g),
                'mean_leakage_improvement':statistics.fmean(x['improvement']['random_mean_over_source_leakage'] for x in g),
                'mean_fraction_random_worse_return':statistics.fmean(x['random_controls']['fraction_random_worse_return'] for x in g),
                'mean_fraction_random_worse_leakage':statistics.fmean(x['random_controls']['fraction_random_worse_leakage'] for x in g),
              }
          out={'test':'CAUSAL_SET_HETEROGENEOUS_MASS_COMPOSITION_SUMMARY','n_jobs':len(rows),'by_pair':by_pair,
               'overall':{
                 'mean_operator_difference':statistics.fmean(x['operator_relative_difference'] for x in rows),
                 'mean_return_improvement':statistics.fmean(x['improvement']['random_mean_over_source_return'] for x in rows),
                 'mean_leakage_improvement':statistics.fmean(x['improvement']['random_mean_over_source_leakage'] for x in rows),
                 'mean_fraction_random_worse_return':statistics.fmean(x['random_controls']['fraction_random_worse_return'] for x in rows),
                 'mean_fraction_random_worse_leakage':statistics.fmean(x['random_controls']['fraction_random_worse_leakage'] for x in rows)},
               'claim_lock':'Heterogeneous mass-deformed causal-set composition with P frozen by source SSEE spectral rule.'}
          pathlib.Path('causal_heterogeneous_mass_summary.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(json.dumps(out,indent=2,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: isqgr-causal-set-heterogeneous-mass-summary
          path: causal_heterogeneous_mass_summary.json
          if-no-files-found: error
