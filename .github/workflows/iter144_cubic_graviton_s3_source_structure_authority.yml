name: ITER144 cubic graviton S3 source structure authority
on:
  push:
    branches: [main]
    paths:
      - 'analysis/iter144_cubic_graviton_s3_source_structure_authority.py'
      - '.github/workflows/iter144_cubic_graviton_s3_source_structure_authority.yml'
  workflow_dispatch:
jobs:
  s3-source-structure-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install sympy
      - name: Frozen ITER144 pinned-source and EH comparison
        run: python analysis/iter144_cubic_graviton_s3_source_structure_authority.py | tee iter144.log
      - uses: actions/upload-artifact@v4
        with:
          name: iter144-cubic-graviton-s3-source-structure-authority
          path: |
            iter144_cubic_graviton_s3_source_structure_authority.json
            iter144.log
          if-no-files-found: error
