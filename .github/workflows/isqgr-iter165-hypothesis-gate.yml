name: ISQGR ITER165 meromorphic-family hypothesis gate
on:
  push:
    paths:
      - 'analysis/iter165_hypothesis_gate.py'
      - '.github/workflows/isqgr-iter165-hypothesis-gate.yml'
  workflow_dispatch:
jobs:
  hypothesis-gate:
    strategy:
      fail-fast: false
      matrix:
        lane: [constructive, completeness-falsifier, contact-orientation-critic]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run frozen ITER165 gate
        run: python analysis/iter165_hypothesis_gate.py | tee iter165-${{ matrix.lane }}.log
      - name: Preserve lane artifact
        run: |
          mkdir -p out
          cp artifacts/iter165_hypothesis_gate.json out/iter165-${{ matrix.lane }}.json
          cp iter165-${{ matrix.lane }}.log out/
      - uses: actions/upload-artifact@v4
        with:
          name: iter165-${{ matrix.lane }}
          path: out/
