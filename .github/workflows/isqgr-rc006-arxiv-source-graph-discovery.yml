name: ISQGR RC006 arXiv Source Graph Discovery

on:
  push:
    branches: [main]
    paths:
      - 'experiments/rc006_arxiv_source_graph_discovery.py'
      - '.github/workflows/isqgr-rc006-arxiv-source-graph-discovery.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch official arXiv source archive
        run: |
          set -euo pipefail
          mkdir -p external/arxiv_src
          (curl -fL --retry 3 --retry-delay 2 https://export.arxiv.org/e-print/1609.02429 -o /tmp/src.tar || \
           curl -fL --retry 3 --retry-delay 2 https://arxiv.org/e-print/1609.02429 -o /tmp/src.tar)
          tar -xf /tmp/src.tar -C external/arxiv_src
      - name: Build metadata-only Eq29 source manifest
        run: |
          mkdir -p compute_out
          python experiments/rc006_arxiv_source_graph_discovery.py --source-dir external/arxiv_src --output compute_out/source_graph_manifest.json
      - uses: actions/upload-artifact@v4
        with:
          name: rc006-arxiv-source-graph-manifest
          path: compute_out/*.json
          if-no-files-found: error
