name: ISQGR Iter006 RC006 Representation-Aware Braid Structure

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/isqgr_iter006_rc006_representation_aware_braid_structure.yml'

permissions:
  contents: read

jobs:
  tex-structural:
    runs-on: ubuntu-24.04
    steps:
      - name: Fetch immutable arXiv v1 source
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -o src.tar https://export.arxiv.org/e-print/1112.2511v1
          echo 'd2dfda1a79b9978422b5a57387f9bbf1ebd4828327c656b59ed74c0acc98302c  src.tar' | sha256sum -c -
          mkdir src
          tar -xf src.tar -C src || (cd src && tar -xzf ../src.tar)
          find src -type f -name '*.tex' -print0 | sort -z | xargs -0 cat > source.tex
      - name: Parse Proposition 3.4 index graph
        run: |
          python - <<'PY'
          import pathlib,re,json,hashlib
          t=pathlib.Path('source.tex').read_text(errors='ignore')
          low=t.lower()
          # Bound the Proposition 3.4 neighborhood structurally, independent of RC006 outcomes.
          starts=[m.start() for m in re.finditer(r'\\begin\{proposition\}',t)]
          blocks=[]
          for s in starts:
              e=t.find('\\end{proposition}',s)
              if e>=0: blocks.append(t[s:e+len('\\end{proposition}')])
          cand=[b for b in blocks if 'braid' in b.lower() and ('\\iota' in b or 'EPRL' in b)]
          block=cand[0] if len(cand)==1 else ''
          norm=' '.join(re.sub(r'[^a-z0-9]+',' ',block.lower()).split())
          sum_k=bool(re.search(r'\\sum\s*_?\s*\{?K\}?',block))
          alpha1k=('alpha 1 k' in norm or '\\alpha_1(K)' in block or '\\alpha_{1}(K)' in block)
          alpha2k2=('alpha 2 k2' in norm or '\\alpha_2(K_2)' in block or '\\alpha_{2}(K_2)' in block)
          unchanged34=(('alpha 3 k3' in norm or '\\alpha_3(K_3)' in block) and ('alpha 4 k4' in norm or '\\alpha_4(K_4)' in block))
          lam=('\\Lambda' in block or 'lambda' in norm)
          input_order=(('alpha 1 k1' in norm) and ('alpha 2 k2' in norm))
          output_not_perm=bool(sum_k and alpha1k and alpha2k2 and input_order)
          footnote=('not necessarily an eprl representation' in low)
          free_summed=bool(sum_k and alpha1k and alpha2k2 and unchanged34 and footnote)
          valid=(len(cand)==1 and all([sum_k,alpha1k,alpha2k2,unchanged34,lam,output_not_perm,free_summed]))
          out={'gate':'ITER006_RC006_REPRESENTATION_AWARE_BRAID_STRUCTURE','lane':'TEX_STRUCTURAL_PARSE','valid':valid,'proposition_candidate_count':len(cand),'sum_over_K':sum_k,'output_alpha1_depends_on_K':alpha1k,'output_alpha2_K2_present':alpha2k2,'alpha3_K3_alpha4_K4_preserved':unchanged34,'nontrivial_Lambda_kernel':lam,'input_to_output_not_simple_permutation':output_not_perm,'free_vs_summed_structure_distinguished':free_summed,'alpha1K_not_necessarily_EPRL_source_note':footnote,'block_sha256':hashlib.sha256(block.encode()).hexdigest() if block else None}
          pathlib.Path('tex_structure.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n'); print(json.dumps(out,indent=2,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: representation-aware-braid-tex
          path: tex_structure.json
          if-no-files-found: error

  pdf-structural:
    runs-on: ubuntu-24.04
    steps:
      - name: Fetch immutable arXiv v1 PDF
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y poppler-utils >/dev/null
          curl -L --fail --retry 3 -o paper.pdf https://arxiv.org/pdf/1112.2511v1
          echo 'b41866cdd69defdef1862416bfb40e8b4c39775b53a51718a7cae837fedf6667  paper.pdf' | sha256sum -c -
          pdftotext -layout paper.pdf paper.txt
      - name: Independently parse Proposition 3.4 semantics
        run: |
          python - <<'PY'
          import pathlib,re,json,hashlib
          t=pathlib.Path('paper.txt').read_text(errors='ignore'); low=' '.join(t.lower().split())
          i=low.find('proposition 3.4')
          j=low.find('4. the 4-simplex amplitude',i if i>=0 else 0)
          block=low[i:(j if j>i else min(len(low),i+2500))] if i>=0 else ''
          # pdftotext can separate math glyphs; require both formula semantics and explanatory sentence.
          sum_k=('= ∑ k' in block or '= ∑k' in block or 'transforms as' in block and '∑' in block)
          alpha1k=('α1(k)' in block or 'α1 (k)' in block or 'alpha1(k)' in block)
          alpha2k2=('α2(k2)' in block or 'α2 (k2)' in block or 'alpha2(k2)' in block)
          preserved34=(('α3(k3)' in block or 'α3 (k3)' in block) and ('α4(k4)' in block or 'α4 (k4)' in block))
          lam=('λ' in block or 'lambda' in block)
          noninv='not invariant under braiding' in block
          not_eprl='not necessarily an eprl representation' in block
          output_not_perm=bool(sum_k and alpha1k and not_eprl)
          free_summed=bool(sum_k and alpha1k and alpha2k2 and preserved34 and not_eprl)
          valid=all([i>=0,sum_k,alpha1k,alpha2k2,preserved34,lam,noninv,output_not_perm,free_summed])
          out={'gate':'ITER006_RC006_REPRESENTATION_AWARE_BRAID_STRUCTURE','lane':'PDF_TEXT_STRUCTURAL_PARSE','valid':valid,'proposition_found':i>=0,'sum_over_K':sum_k,'output_alpha1_depends_on_K':alpha1k,'output_alpha2_K2_present':alpha2k2,'alpha3_K3_alpha4_K4_preserved':preserved34,'nontrivial_Lambda_kernel':lam,'non_invariance_under_braiding':noninv,'input_to_output_not_simple_permutation':output_not_perm,'free_vs_summed_structure_distinguished':free_summed,'alpha1K_not_necessarily_EPRL_source_note':not_eprl,'block_sha256':hashlib.sha256(block.encode()).hexdigest() if block else None}
          pathlib.Path('pdf_structure.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n'); print(json.dumps(out,indent=2,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: representation-aware-braid-pdf
          path: pdf_structure.json
          if-no-files-found: error

  aggregate:
    needs: [tex-structural, pdf-structural]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: representation-aware-braid-*
          path: inputs
          merge-multiple: true
      - name: Apply frozen structure classifier
        run: |
          python - <<'PY'
          import pathlib,json
          rows=[]
          for n in ['tex_structure.json','pdf_structure.json']:
              p=pathlib.Path('inputs')/n
              if p.exists(): rows.append(json.loads(p.read_text()))
          valid=(len(rows)==2 and all(r.get('valid') is True for r in rows))
          if valid: cl='QEPRL_BRAIDING_REPRESENTATION_AWARE_STRUCTURE_EXTRACTED'
          elif len(rows)==2 and any(r.get('valid') for r in rows): cl='QEPRL_BRAIDING_REPRESENTATION_AWARE_STRUCTURE_PARTIAL'
          else: cl='QEPRL_BRAIDING_REPRESENTATION_AWARE_STRUCTURE_UNSUPPORTED'
          out={'gate':'ITER006_RC006_REPRESENTATION_AWARE_BRAID_STRUCTURE','valid':len(rows)==2,'classification':cl,'lanes':rows,'source_to_rc006_namespace_mapping_preregistration_authorized':cl=='QEPRL_BRAIDING_REPRESENTATION_AWARE_STRUCTURE_EXTRACTED','sign_only_mapping_authorized':False,'eq29_amplitude_authorized':False,'historical_holdout_fail_rewritten':False,'bridge_credit':False}
          pathlib.Path('summary.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n'); print(json.dumps(out,indent=2,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: representation-aware-braid-structure-summary
          path: summary.json
          if-no-files-found: error
