name: ITER179 RC007 eigenvector fluctuation selector

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/iter179-rc007-eigenvector-fluctuation-selector.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  researcher:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        n: [384, 512, 768, 1024]
        core_seed: [311, 337]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check numpy scipy
      - name: Frozen Researcher persistence selector
        run: |
          python analysis/iter179_eigenvector_fluctuation_selector.py \
            --n ${{ matrix.n }} --core-seed ${{ matrix.core_seed }} \
            --out out/researcher_N${{ matrix.n }}_s${{ matrix.core_seed }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iter179-researcher-N${{ matrix.n }}-s${{ matrix.core_seed }}
          path: out/*.json
          if-no-files-found: error

  critic:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        n: [384, 512, 768, 1024]
        core_seed: [311, 337]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check numpy scipy
      - name: Independent Critic persistence selector
        run: |
          python analysis/iter179_eigenvector_fluctuation_critic.py \
            --n ${{ matrix.n }} --core-seed ${{ matrix.core_seed }} \
            --out out/critic_N${{ matrix.n }}_s${{ matrix.core_seed }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iter179-critic-N${{ matrix.n }}-s${{ matrix.core_seed }}
          path: out/*.json
          if-no-files-found: error

  aggregate:
    if: always()
    needs: [researcher, critic]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check numpy
      - uses: actions/download-artifact@v4
        with:
          pattern: iter179-researcher-*
          path: collected/researcher
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: iter179-critic-*
          path: collected/critic
          merge-multiple: true
      - name: Frozen aggregate classifier
        run: |
          python analysis/iter179_eigenvector_fluctuation_aggregate.py \
            --researcher-dir collected/researcher \
            --critic-dir collected/critic \
            --out aggregate/summary.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iter179-aggregate
          path: aggregate/summary.json
          if-no-files-found: error
