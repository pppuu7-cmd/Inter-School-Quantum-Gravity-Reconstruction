name: ISQGR RC-009 Fixed Point Survival Audit

on:
  push:
    branches: [main]
    paths:
      - 'experiments/rc009_fixed_point_survival_audit.py'
      - '.github/workflows/isqgr-rc009-fixed-point-survival.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run frozen source-data audit
        run: |
          set -euo pipefail
          mkdir -p compute_out
          python experiments/rc009_fixed_point_survival_audit.py --output compute_out/rc009_fixed_point_survival.json
      - uses: actions/upload-artifact@v4
        with:
          name: isqgr-rc009-fixed-point-survival
          path: compute_out/*.json
          if-no-files-found: error
