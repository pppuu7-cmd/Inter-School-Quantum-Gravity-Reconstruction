name: ISQGR Iter022 dual braid primitives

on:
  push:
    branches: [main]
    paths:
      - 'code/iter022/**'
      - '.github/workflows/isqgr-iter022-dual-braid-primitives.yml'
      - 'triggers/iter022.txt'
  workflow_dispatch:

jobs:
  audit:
    strategy:
      fail-fast: false
      matrix:
        lane: [capcup, qbar, rbraid, 'null']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pin numerical runtime
        run: pip install 'numpy==2.3.3' 'mpmath==1.3.0'
      - name: Run frozen lane
        run: python code/iter022/dual_braid_primitives.py --lane '${{ matrix.lane }}'
      - name: Upload raw evidence
        uses: actions/upload-artifact@v4
        with:
          name: iter022-${{ matrix.lane }}
          path: out/

  aggregate:
    needs: audit
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: iter022-*
          path: lanes
      - name: Frozen aggregate
        run: |
          python - <<'PY'
          import glob,json,os
          ev=[]
          for f in glob.glob('lanes/**/evidence.json',recursive=True):
              try: ev.append(json.load(open(f)))
              except Exception: pass
          expected={'capcup','qbar','rbraid','null'}; by={x.get('lane'):x for x in ev}
          infra=set(by)!=expected or any(x.get('infrastructure_failure') for x in ev)
          if infra: cls='RC006_DUAL_BRAID_INFRASTRUCTURE_PARTIAL'
          elif not by['capcup'].get('pass') or not by['null'].get('pass'): cls='RC006_DUAL_BRAID_NULL_CALIBRATION_FAIL'
          elif not by['qbar'].get('pass'): cls='RC006_QBAR_DUAL_TRANSLATION_BLOCKED'
          elif not by['rbraid'].get('pass'): cls='RC006_DUAL_BRAID_BLOCKED_EXTERNAL_R_AUTHORITY'
          else: cls='RC006_DUAL_BRAID_PRIMITIVES_QUALIFIED'
          out={'classification':cls,'lane_pass':{k:bool(by.get(k,{}).get('pass')) for k in expected},'bridge_credit':False,'candidate_theory_authorized':False,'new_physics_found':False,'eq29_amplitude_authorized':False,'preferred_alpha_found':False,'iter012_retry_authorized':False,'lanes':ev}
          os.makedirs('aggregate',exist_ok=True); json.dump(out,open('aggregate/aggregate.json','w'),indent=2,sort_keys=True); print(json.dumps(out,indent=2,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: iter022-aggregate
          path: aggregate/aggregate.json
