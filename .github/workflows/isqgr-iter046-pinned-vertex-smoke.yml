name: ISQGR ITER046 pinned Lorentzian EPRL vertex numerical smoke
on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/isqgr-iter046-pinned-vertex-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gate:
    strategy:
      fail-fast: false
      matrix:
        lane: [numerical-primary-heldout, vertex-face-map, backend-source-control, semantic-null]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Frozen ITER046 lane
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          lane='${{ matrix.lane }}'
          if [[ "$lane" == "numerical-primary-heldout" ]]; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq build-essential m4 lzip libquadmath0 libomp-dev libgmp-dev libmpfr-dev libmpc-dev libgsl-dev libopenblas-dev wget
            git clone -q https://github.com/qg-cpt-marseille/sl2cfoam-next.git backend
            git -C backend checkout -q 052e4346028870bd76f69a3034e6cae8defb8f7f
            test "$(git -C backend rev-parse HEAD)" = '052e4346028870bd76f69a3034e6cae8defb8f7f'
            mkdir -p backend/ext
            cd backend/ext
            curl --fail -L --retry 5 --retry-delay 2 https://fy.chalmers.se/subatom/wigxjpf/wigxjpf-1.13.tar.gz -o wigxjpf.tar.gz
            tar -xzf wigxjpf.tar.gz
            mv wigxjpf-1.13 wigxjpf
            make -C wigxjpf -j2
            curl --fail -L --retry 5 --retry-delay 2 https://fy.chalmers.se/subatom/fastwigxj/fastwigxj-1.4.1.tar.gz -o fastwigxj.tar.gz
            tar -xzf fastwigxj.tar.gz
            mv fastwigxj-1.4.1 fastwigxj
            if ! make -C fastwigxj -j2; then
              echo 'FASTWIGXJ_BUILD_FAILED_PRE_SCIENCE' > ../../out/infrastructure_marker.txt
              exit 70
            fi
            cd ..
            mkdir -p data_sl2cfoam
            ext/fastwigxj/bin/hash_js --max-E-3j=20 /dev/null data_sl2cfoam/table_20.3j
            ext/fastwigxj/bin/hash_js --max-E-6j=20 /dev/null data_sl2cfoam/table_20.6j
            make BLAS=system OMP=0 -j2
            primary1=$(bin/vertex-amplitude "$PWD/data_sl2cfoam" 1.2 2,2,2,2,2,2,2,2,2,2 0,0,0,0,0 0 | tail -n1)
            primary2=$(bin/vertex-amplitude "$PWD/data_sl2cfoam" 1.2 2,2,2,2,2,2,2,2,2,2 0,0,0,0,0 0 | tail -n1)
            held1=$(bin/vertex-amplitude "$PWD/data_sl2cfoam" 1.2 2,2,2,2,2,2,2,2,2,2 2,2,2,2,2 0 | tail -n1)
            held2=$(bin/vertex-amplitude "$PWD/data_sl2cfoam" 1.2 2,2,2,2,2,2,2,2,2,2 2,2,2,2,2 0 | tail -n1)
            cd ..
            PRIMARY1="$primary1" PRIMARY2="$primary2" HELD1="$held1" HELD2="$held2" python3 - <<'PY'
          import json,math,os
          vals={k:float(os.environ[k]) for k in ['PRIMARY1','PRIMARY2','HELD1','HELD2']}
          finite=all(math.isfinite(x) for x in vals.values())
          ptol=1e-12*max(1.0,abs(vals['PRIMARY1']))
          htol=1e-12*max(1.0,abs(vals['HELD1']))
          prep=abs(vals['PRIMARY1']-vals['PRIMARY2']) <= ptol
          hrep=abs(vals['HELD1']-vals['HELD2']) <= htol
          passed=finite and prep and hrep
          out={'lane':'numerical-primary-heldout','backend_sha':'052e4346028870bd76f69a3034e6cae8defb8f7f','gamma':1.2,'two_j':[2]*10,'Dl':0,'primary_two_i':[0]*5,'heldout_two_i':[2]*5,'values':vals,'finite':finite,'primary_repeat_tol':ptol,'heldout_repeat_tol':htol,'primary_repeat_pass':prep,'heldout_repeat_pass':hrep,'scientific_pass':passed,'classification':'NUMERICAL_SMOKE_PASS' if passed else 'SCIENTIFIC_NUMERICAL_FAIL'}
          open('out/evidence.json','w').write(json.dumps(out,indent=2)+'\n')
          if not passed: raise SystemExit(2)
          PY
            rm -rf backend
          elif [[ "$lane" == "vertex-face-map" ]]; then
            python3 - <<'PY'
          import itertools,json
          orig=range(5); c=5
          simplices=[tuple(sorted((c,)+tuple(v for v in orig if v!=omit))) for omit in orig]
          internal=[tuple(sorted((c,a,b))) for a,b in itertools.combinations(orig,2)]
          boundary=list(itertools.combinations(orig,3))
          ic={str(t):sum(set(t).issubset(s) for s in simplices) for t in internal}
          bc={str(t):sum(set(t).issubset(s) for s in simplices) for t in boundary}
          passed=len(internal)==10 and len(boundary)==10 and set(ic.values())=={3} and set(bc.values())=={2}
          out={'lane':'vertex-face-map','refined_4simplices':simplices,'internal_triangle_multiplicity':ic,'boundary_triangle_multiplicity':bc,'scientific_pass':passed,'classification':'FACE_MAP_PASS' if passed else 'FACE_MAP_FAIL'}
          open('out/evidence.json','w').write(json.dumps(out,indent=2)+'\n')
          if not passed: raise SystemExit(2)
          PY
          elif [[ "$lane" == "backend-source-control" ]]; then
            git clone -q https://github.com/qg-cpt-marseille/sl2cfoam-next.git backend
            git -C backend checkout -q 052e4346028870bd76f69a3034e6cae8defb8f7f
            sha256sum backend/tools/vertex-amplitude.c backend/src/vertex.c backend/inc/sl2cfoam.h backend/Makefile backend/QUICKSTART_Ubuntu.md > out/source_hashes.txt
            python3 - <<'PY'
          import pathlib,json,subprocess,re
          cli=pathlib.Path('backend/tools/vertex-amplitude.c').read_text(errors='replace')
          quick=pathlib.Path('backend/QUICKSTART_Ubuntu.md').read_text(errors='replace')
          sha=subprocess.check_output(['git','-C','backend','rev-parse','HEAD'],text=True).strip()
          preds={'sha':sha=='052e4346028870bd76f69a3034e6cae8defb8f7f','ten_js':bool(re.search(r'two_js\[10\]',cli)),'five_is':bool(re.search(r'two_is\[5\]',cli)),'dl':('sl2cfoam_vertex_amplitude(two_js, two_is, Dl)' in cli),'gamma':('Immirzi' in cli),'quickstart_reference':('Immirzi = 1.2' in quick and 'Dl = 5' in quick)}
          passed=all(preds.values())
          open('out/evidence.json','w').write(json.dumps({'lane':'backend-source-control','predicates':preds,'scientific_pass':passed,'classification':'SOURCE_CONTROL_PASS' if passed else 'SOURCE_CONTROL_BLOCKED'},indent=2)+'\n')
          if not passed: raise SystemExit(2)
          PY
            rm -rf backend
          else
            python3 - <<'PY'
          import json
          controls=[
            {'claim':'finite single vertex implies 1-to-5 convergence','accepted':False},
            {'claim':'deterministic repeatability implies refinement invariance','accepted':False},
            {'claim':'Dl=0 implies shell convergence','accepted':False},
            {'claim':'held-out finite amplitude authorizes retuning','accepted':False}]
          passed=all(not c['accepted'] for c in controls)
          open('out/evidence.json','w').write(json.dumps({'lane':'semantic-null','controls':controls,'null_pass':passed,'classification':'NULL_PASS' if passed else 'NULL_FAIL'},indent=2)+'\n')
          if not passed: raise SystemExit(2)
          PY
          fi
          python3 - <<'PY'
          import json,pathlib
          e=json.loads(pathlib.Path('out/evidence.json').read_text())
          pathlib.Path('out/manifest.json').write_text(json.dumps({'lane':'${{ matrix.lane }}','classification':e.get('classification'),'files':[p.name for p in pathlib.Path('out').iterdir()]},indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iter046-${{ matrix.lane }}
          path: out/
          if-no-files-found: warn
          retention-days: 90
  aggregate:
    needs: gate
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: iter046-*
          path: collected
      - name: Frozen aggregate
        run: |
          python3 - <<'PY'
          import json,pathlib
          ev=[]
          for p in pathlib.Path('collected').glob('iter046-*/evidence.json'):
            ev.append(json.loads(p.read_text()))
          by={e['lane']:e for e in ev}
          complete=len(by)==4
          numerical=by.get('numerical-primary-heldout',{}).get('scientific_pass') is True
          face=by.get('vertex-face-map',{}).get('scientific_pass') is True
          source=by.get('backend-source-control',{}).get('scientific_pass') is True
          null=by.get('semantic-null',{}).get('null_pass') is True
          if complete and numerical and face and source and null:
            cls='LORENTZIAN_PINNED_VERTEX_NUMERICAL_SMOKE_PASS'
          elif 'numerical-primary-heldout' not in by:
            cls='INFRASTRUCTURE_FAIL'
          elif complete:
            cls='SCIENTIFIC_FAIL_OR_BLOCKED_REQUIRES_RAW_CLASSIFICATION'
          else:
            cls='INFRASTRUCTURE_FAIL'
          out={'classification':cls,'lane_count':len(by),'numerical_pass':numerical,'face_map_pass':face,'source_control_pass':source,'null_pass':null,'bounded_multivertex_successor_authorized':cls=='LORENTZIAN_PINNED_VERTEX_NUMERICAL_SMOKE_PASS','refinement_map_derived':False,'bridge_credit':False,'candidate_theory_authorized':False}
          pathlib.Path('aggregate').mkdir(); pathlib.Path('aggregate/summary.json').write_text(json.dumps(out,indent=2)+'\n'); print(json.dumps(out,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: iter046-aggregate
          path: aggregate/
          if-no-files-found: error
          retention-days: 90
