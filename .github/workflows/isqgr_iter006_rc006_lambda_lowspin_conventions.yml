name: ISQGR Iter006 RC006 Lambda Lowspin Conventions

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/isqgr_iter006_rc006_lambda_lowspin_conventions.yml'

permissions:
  contents: read

jobs:
  convention-lane:
    strategy:
      fail-fast: false
      matrix:
        mode: [principal-labels, q-ribbon, q-binomial-boundary, controls]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Fetch frozen source
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -o source.archive 'https://export.arxiv.org/e-print/math/9910147v1'
          echo '316ab7737a6e201c9c5d988326077358b562e6f5d47cfffbf1d2935cdd9389bc  source.archive' | sha256sum -c -
          mkdir src
          if tar -tf source.archive >/dev/null 2>&1; then tar -xf source.archive -C src;
          elif gzip -t source.archive >/dev/null 2>&1; then gzip -dc source.archive > src/source.tex;
          else cp source.archive src/source.tex; fi
          find src -type f -name '*.tex' -print0 | sort -z | xargs -0 cat > source.tex
          test -s source.tex
      - name: Extract exact convention evidence
        env:
          MODE: ${{ matrix.mode }}
        run: |
          python - <<'PY'
          import json,os,pathlib,re
          mode=os.environ['MODE']; text=pathlib.Path('source.tex').read_text(errors='ignore'); lines=text.splitlines()
          pats={
            'principal-labels':[r'Principal Unitary Representations',r'X_0.*X_1.*mathbb S',r'm_X',r'rho_X',r'lambda=\(m'],
            'q-ribbon':[r'v_\{',r'v_X',r'qd\{',r'quantum dimension',r'q-number',r'\[d_'],
            'q-binomial-boundary':[r'binom',r'lambdaboundary',r'symetryLambda',r'Pochhammer',r'\)_\\infty'],
            'controls':[r'unitary',r'overline.*Lambda',r'formlamb6j',r'lambdaboundary',r'symetryLambda',r'intlambda',r'selection rules']
          }[mode]
          hits=[]
          for i,line in enumerate(lines,1):
            if any(re.search(p,line,re.I) for p in pats):
              a=max(1,i-4); b=min(len(lines),i+4)
              hits.append({'line':i,'excerpt':'\n'.join(f'{j}: {lines[j-1]}' for j in range(a,b+1))})
          kept=[]; last=-100
          for h in hits:
            if h['line']-last<3: continue
            kept.append(h); last=h['line']
            if len(kept)>=50: break
          low=text.lower()
          if mode=='principal-labels':
            signal=('principal unitary representations' in low and '(x_0, x_1)' in low and ('rho_x' in low or '\\rho_x' in low))
          elif mode=='q-ribbon':
            signal=('v_' in text and ('quantum dimension' in low or '\\qd' in text or '[d_' in text))
          elif mode=='q-binomial-boundary':
            signal=('lambdaboundary' in text and 'symetryLambda' in text and ('binom' in text))
          else:
            signal=('formlamb6j' in text and 'lambdaboundary' in text and ('overline' in text) and ('selection rules' in low))
          out={'gate':'ITER006_RC006_LAMBDA_LOWSPIN_CONVENTION_PANEL','mode':mode,'source_sha256':'316ab7737a6e201c9c5d988326077358b562e6f5d47cfffbf1d2935cdd9389bc','evidence_signal':bool(signal),'hit_count_total':len(hits),'anchors':kept}
          pathlib.Path('evidence.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(json.dumps({'mode':mode,'signal':bool(signal),'hits':len(hits),'kept':len(kept)},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: lambda-convention-${{ matrix.mode }}
          path: evidence.json
          if-no-files-found: error

  aggregate:
    needs: convention-lane
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: lambda-convention-*
          path: inputs
          merge-multiple: false
      - name: Evidence summary only
        run: |
          python - <<'PY'
          import json,pathlib
          rows=[json.loads(p.read_text()) for p in sorted(pathlib.Path('inputs').glob('**/evidence.json'))]
          expected={'principal-labels','q-ribbon','q-binomial-boundary','controls'}
          modes={r['mode'] for r in rows}
          out={'gate':'ITER006_RC006_LAMBDA_LOWSPIN_CONVENTION_PANEL','lane_count':len(rows),'all_modes_present':modes==expected,'all_evidence_signals':len(rows)==4 and all(r['evidence_signal'] for r in rows),'manual_raw_source_classification_required':True,'automatic_scientific_pass':False,'numerical_lowspin_panel_authorized':False,'eq29_amplitude_authorized':False,'bridge_credit':False,'candidate_theory_authorized':False}
          pathlib.Path('summary.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(json.dumps(out,indent=2,sort_keys=True))
          if modes!=expected: raise SystemExit(2)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lambda-lowspin-convention-summary
          path: summary.json
          if-no-files-found: warn
