name: ISQGR ITER041 root-unity primitive-domain source audit
on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/isqgr-iter041-root-unity-source-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lanes:
    strategy:
      fail-fast: false
      matrix:
        lane: [A, B, C, D]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: |
          rm -rf out/iter041
          python3 code/iter041/root_unity_primitive_domain_source_audit.py --lane ${{ matrix.lane }}
      - run: |
          mkdir -p lane_out
          cp out/iter041/evidence.json lane_out/evidence.json
          cat lane_out/evidence.json
      - uses: actions/upload-artifact@v4
        with:
          name: iter041-${{ matrix.lane }}
          path: lane_out/
          if-no-files-found: error
          retention-days: 90
  aggregate:
    needs: lanes
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: iter041-*
          path: collected
      - run: |
          python3 - <<'PY'
          import json,pathlib
          rows={p.parent.name.split('-')[-1]:json.loads(p.read_text()) for p in pathlib.Path('collected').glob('iter041-*/evidence.json')}
          expected={'A','B','C','D'}
          infra=set(rows)!=expected or any(v.get('infrastructure_failure') for v in rows.values())
          collected=(not infra and all(rows[k].get('pass') for k in expected))
          out={'classification':'EVIDENCE_COLLECTED_REQUIRES_STRICT_SOURCE_VERDICT' if collected else 'INFRASTRUCTURE_FAIL','evidence_collected':collected,'lane_pass':{k:bool(rows.get(k,{}).get('pass')) for k in sorted(expected)},'ITER039_remains_scientific_fail':True,'numerical_retry_authorized':False,'full_eq27_amplitude_derived':False,'bridge_credit':False,'candidate_theory_authorized':False}
          pathlib.Path('aggregate').mkdir()
          pathlib.Path('aggregate/summary.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(json.dumps(out,indent=2,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: iter041-aggregate
          path: aggregate/
          if-no-files-found: error
          retention-days: 90
