name: ISQGR Lorentzian EPRL DVD B4 Prerequisites
on:
  push:
    branches: [main]
    paths:
      - 'experiments/lorentzian_eprl_dvd_booster_serialization.py'
      - 'experiments/sl2cfoam_b4_accuracy_gate.py'
      - '.github/workflows/isqgr-lorentzian-eprl-dvd-b4-prerequisites.yml'
  workflow_dispatch:
permissions: {contents: read}
env:
  ARXIV_ID: '1801.03771'
  SL2CFOAM_SHA: '052e4346028870bd76f69a3034e6cae8defb8f7f'

jobs:
  serialize:
    strategy:
      fail-fast: false
      matrix:
        label: [DVD2, DVD3]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Fetch pinned paper source
        run: |
          set -euo pipefail
          mkdir -p external/two_vertex_src
          (curl -fL --retry 3 --retry-delay 2 https://export.arxiv.org/e-print/${ARXIV_ID} -o /tmp/src.tar || curl -fL --retry 3 --retry-delay 2 https://arxiv.org/e-print/${ARXIV_ID} -o /tmp/src.tar)
          tar -xf /tmp/src.tar -C external/two_vertex_src
      - name: Serialize labelled amplitude to B4 calls
        run: |
          mkdir -p compute_out
          python experiments/lorentzian_eprl_dvd_booster_serialization.py --source-dir external/two_vertex_src --label '${{ matrix.label }}' --output 'compute_out/${{ matrix.label }}_serialization.json'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 'dvd-b4-serialization-${{ matrix.label }}'
          path: compute_out/*.json
          if-no-files-found: error

  b4-kernel:
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        gamma: ['0.5','1.2','2.0']
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-12 g++-12 m4 lzip wget ca-certificates libgmp-dev libmpfr-dev libmpc-dev libgsl-dev libopenblas-dev libblas-dev libomp-dev
      - name: Checkout pinned sl2cfoam-next
        run: |
          git clone https://github.com/qg-cpt-marseille/sl2cfoam-next.git external/sl2cfoam-next
          git -C external/sl2cfoam-next checkout ${SL2CFOAM_SHA}
          test "$(git -C external/sl2cfoam-next rev-parse HEAD)" = "${SL2CFOAM_SHA}"
      - name: Build Wigner dependencies and B4 test
        working-directory: external/sl2cfoam-next
        run: |
          set -euo pipefail
          mkdir -p ext test/test_data
          cd ext
          wget -q https://fy.chalmers.se/subatom/wigxjpf/wigxjpf-1.13.tar.gz -O wigxjpf.tar.gz
          tar -xzf wigxjpf.tar.gz && mv wigxjpf-1.13 wigxjpf
          make -C wigxjpf CC=gcc-12 -j2
          wget -q https://fy.chalmers.se/subatom/fastwigxj/fastwigxj-1.4.1.tar.gz -O fastwigxj.tar.gz
          tar -xzf fastwigxj.tar.gz && mv fastwigxj-1.4.1 fastwigxj
          make -C fastwigxj CC=gcc-12 CXX=g++-12 -j2
          cd ..
          ./ext/fastwigxj/bin/hash_js --max-E-3j=24 /dev/null ./test/test_data/table_24.3j
          ./ext/fastwigxj/bin/hash_js --max-E-6j=24 /dev/null ./test/test_data/table_24.6j
          make CC=gcc-12 BLAS=system OMP=0 tests -j2
          test -x bin/b4_test
      - name: Run fast-vs-accurate B4 gate
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/external/sl2cfoam-next/lib
        run: |
          set -euo pipefail
          mkdir -p compute_out
          cd external/sl2cfoam-next
          ./bin/b4_test 2 2 2 2 2 2 2 2 '${{ matrix.gamma }}' acc | tee ../../compute_out/b4_${{ matrix.gamma }}.log
          cd ../..
          python experiments/sl2cfoam_b4_accuracy_gate.py --log 'compute_out/b4_${{ matrix.gamma }}.log' --gamma '${{ matrix.gamma }}' --output 'compute_out/b4_${{ matrix.gamma }}.json'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 'b4-kernel-gamma-${{ matrix.gamma }}'
          path: compute_out/*
          if-no-files-found: error

  aggregate:
    needs: [serialize, b4-kernel]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: 'dvd-b4-serialization-*'
          path: ser
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: 'b4-kernel-gamma-*'
          path: ker
          merge-multiple: true
      - name: Aggregate frozen prerequisite gate
        run: |
          python - <<'PY'
          import glob,json,pathlib
          ss=[json.load(open(f)) for f in glob.glob('ser/*.json')]
          kk=[json.load(open(f)) for f in glob.glob('ker/*.json')]
          ser_ok=len(ss)==2 and all(x.get('serialization_gate_pass') for x in ss)
          ker_ok=len(kk)==3 and all(x.get('gate_pass') for x in kk)
          o={'test':'LORENTZIAN_EPRL_DVD_B4_PREREQUISITES_AGGREGATE','serialization_count':len(ss),'kernel_count':len(kk),
             'serialization_pass':ser_ok,'kernel_pass':ker_ok,'all_pass':bool(ser_ok and ker_ok),
             'classification':'DVD_B4_PREREQUISITES_PASS' if ser_ok and ker_ok else 'DVD_B4_PREREQUISITES_FAIL',
             'numerical_dvd_pilot_authorized':bool(ser_ok and ker_ok),
             'claim_lock':'PASS authorizes only a separately preregistered tiny DVD2/DVD3 numerical pilot. It is not a paper reproduction, refinement map, bridge derivation or new physics.'}
          pathlib.Path('summary.json').write_text(json.dumps(o,indent=2,sort_keys=True)+'\n'); print(json.dumps(o,indent=2,sort_keys=True))
          if not o['all_pass']: raise SystemExit(2)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dvd-b4-prerequisites-summary
          path: summary.json
          if-no-files-found: error
