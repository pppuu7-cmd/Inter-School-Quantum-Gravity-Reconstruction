name: ISQGR ITER040 component validity boundary diagnostic
on:
  push:
    branches: [ main ]
    paths: ['.github/workflows/isqgr-iter040-component-validity-boundary.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  lanes:
    strategy:
      fail-fast: false
      matrix: {lane: [A, B, C, D]}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --disable-pip-version-check numpy mpmath
      - run: |
          rm -rf out/iter040
          python3 code/iter040/component_validity_boundary_diagnostic.py --lane ${{ matrix.lane }}
      - run: |
          mkdir -p lane_out; cp out/iter040/evidence.json lane_out/evidence.json; cat lane_out/evidence.json
      - uses: actions/upload-artifact@v4
        with: {name: iter040-${{ matrix.lane }}, path: lane_out/, if-no-files-found: error, retention-days: 90}
  aggregate:
    needs: lanes
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with: {pattern: iter040-*, path: collected}
      - run: |
          python3 - <<'PY'
          import json,pathlib
          rows={p.parent.name.split('-')[-1]:json.loads(p.read_text()) for p in pathlib.Path('collected').glob('iter040-*/evidence.json')}
          expected={'A','B','C','D'}; infra=set(rows)!=expected or any(v.get('infrastructure_failure') for v in rows.values()); complete=(not infra and all(rows[k].get('pass') for k in expected))
          out={'classification':'RC006_CENTRAL_COMPONENT_VALIDITY_BOUNDARY_DIAGNOSTIC_COMPLETE' if complete else ('NUMERICAL_OR_INFRASTRUCTURE_FAIL' if infra else 'DIAGNOSTIC_INCOMPLETE'),'diagnostic_complete':complete,'lane_pass':{k:bool(rows.get(k,{}).get('pass')) for k in sorted(expected)},'ITER039_remains_scientific_fail':True,'full_eq27_amplitude_derived':False,'bridge_credit':False,'candidate_theory_authorized':False}
          pathlib.Path('aggregate').mkdir(); pathlib.Path('aggregate/summary.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n'); print(json.dumps(out,indent=2,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with: {name: iter040-aggregate, path: aggregate/, if-no-files-found: error, retention-days: 90}
