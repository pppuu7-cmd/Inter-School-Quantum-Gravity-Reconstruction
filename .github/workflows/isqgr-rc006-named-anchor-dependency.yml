name: ISQGR RC006 Named Anchor Dependency

on:
  push:
    branches: [main]
    paths:
      - 'experiments/rc006_named_anchor_dependency_audit.py'
      - '.github/workflows/isqgr-rc006-named-anchor-dependency.yml'
  workflow_dispatch:

permissions: {contents: read}

jobs:
  anchor:
    strategy:
      fail-fast: false
      max-parallel: 7
      matrix:
        anchor: [app:EPRL-diagram, app:EPRL-norm, app:graph, eq:BC-3-int, eq:BC-3-valent, eq:eprl-3-valent, dependency_connectivity]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Fetch official arXiv source
        run: |
          set -euo pipefail
          mkdir -p external/arxiv_src
          (curl -fL --retry 3 --retry-delay 2 https://export.arxiv.org/e-print/1609.02429 -o /tmp/src.tar || curl -fL --retry 3 --retry-delay 2 https://arxiv.org/e-print/1609.02429 -o /tmp/src.tar)
          tar -xf /tmp/src.tar -C external/arxiv_src
      - name: Audit frozen named-anchor dependency object
        run: |
          mkdir -p compute_out
          python experiments/rc006_named_anchor_dependency_audit.py --source-dir external/arxiv_src --anchor '${{ matrix.anchor }}' --output 'compute_out/${{ strategy.job-index }}.json'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 'rc006-anchor-dependency-${{ strategy.job-index }}'
          path: compute_out/*.json
          if-no-files-found: error

  aggregate:
    needs: anchor
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: 'rc006-anchor-dependency-*'
          path: all
          merge-multiple: true
      - name: Preserve frozen classifications
        run: |
          python - <<'PY'
          import glob,json,pathlib
          rows=[json.load(open(f)) for f in sorted(glob.glob('all/*.json'))]
          out={'test':'RC006_NAMED_ANCHOR_DEPENDENCY_AGGREGATE','lane_count':len(rows),'passes':sum(bool(r.get('frozen_gate_pass')) for r in rows),'fails':sum(not bool(r.get('frozen_gate_pass')) for r in rows),'by_anchor':{r['anchor']:r.get('frozen_gate_pass') for r in rows},'all_pass':len(rows)==7 and all(r.get('frozen_gate_pass') for r in rows),'claim_lock':'Named label/ref dependency prerequisite only; no unique tensor ordering or Eq29 amplitude authorization.'}
          pathlib.Path('summary.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n'); print(json.dumps(out,indent=2,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rc006-anchor-dependency-summary
          path: summary.json
          if-no-files-found: error
