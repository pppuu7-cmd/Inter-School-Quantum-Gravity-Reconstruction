name: ISQGR ITER160 raw endpoint support confirmation
on:
  push:
    paths:
      - 'prereg/ITER160_FIRST_MG_G_B2S2_RAW_ENDPOINT_SUPPORT_CONFIRMATION_2026-09-17.md'
      - 'analysis/iter160_raw_endpoint_support_confirmation.py'
      - 'analysis/iter160_adversarial_critic.py'
      - '.github/workflows/isqgr-iter160-raw-endpoint-support-confirmation.yml'
  workflow_dispatch:
jobs:
  confirm-and-critic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact symbolic dependency
        run: python -m pip install 'sympy==1.13.3'
      - name: Run frozen independent producer
        run: python analysis/iter160_raw_endpoint_support_confirmation.py
      - name: Run independent recurrence critic
        run: python analysis/iter160_adversarial_critic.py
      - name: Record deterministic hashes
        run: sha256sum iter160_raw_endpoint_support_confirmation.json iter160_adversarial_critic.json | tee iter160_sha256.txt
      - name: Persist exact results
        uses: actions/upload-artifact@v4
        with:
          name: iter160-raw-endpoint-support-confirmation
          path: |
            iter160_raw_endpoint_support_confirmation.json
            iter160_adversarial_critic.json
            iter160_sha256.txt
          if-no-files-found: error
