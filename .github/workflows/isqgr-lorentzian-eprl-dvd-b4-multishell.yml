name: ISQGR Lorentzian EPRL DVD B4 MultiShell
on:
  push:
    branches: [main]
    paths:
      - 'protocol/ITER006_DVD_B4_MULTISHELL_PREREG.json'
      - 'experiments/sl2cfoam_b4_multishell_gate.py'
      - '.github/workflows/isqgr-lorentzian-eprl-dvd-b4-multishell.yml'
  workflow_dispatch:
permissions: {contents: read}
env:
  SL2CFOAM_SHA: '052e4346028870bd76f69a3034e6cae8defb8f7f'

jobs:
  multishell:
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include:
          - {gamma: '0.5', dl: 0, two_l: 2}
          - {gamma: '0.5', dl: 1, two_l: 4}
          - {gamma: '0.5', dl: 2, two_l: 6}
          - {gamma: '0.5', dl: 3, two_l: 8}
          - {gamma: '1.2', dl: 0, two_l: 2}
          - {gamma: '1.2', dl: 1, two_l: 4}
          - {gamma: '1.2', dl: 2, two_l: 6}
          - {gamma: '1.2', dl: 3, two_l: 8}
          - {gamma: '2.0', dl: 0, two_l: 2}
          - {gamma: '2.0', dl: 1, two_l: 4}
          - {gamma: '2.0', dl: 2, two_l: 6}
          - {gamma: '2.0', dl: 3, two_l: 8}
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-12 g++-12 m4 lzip wget ca-certificates libgmp-dev libmpfr-dev libmpc-dev libgsl-dev libopenblas-dev libblas-dev libomp-dev
      - name: Checkout pinned sl2cfoam-next
        run: |
          git clone https://github.com/qg-cpt-marseille/sl2cfoam-next.git external/sl2cfoam-next
          git -C external/sl2cfoam-next checkout ${SL2CFOAM_SHA}
          test "$(git -C external/sl2cfoam-next rev-parse HEAD)" = "${SL2CFOAM_SHA}"
      - name: Build Wigner dependencies and B4 test
        working-directory: external/sl2cfoam-next
        run: |
          set -euo pipefail
          mkdir -p ext test/test_data
          cd ext
          wget -q https://fy.chalmers.se/subatom/wigxjpf/wigxjpf-1.13.tar.gz -O wigxjpf.tar.gz
          tar -xzf wigxjpf.tar.gz && mv wigxjpf-1.13 wigxjpf
          make -C wigxjpf CC=gcc-12 -j2
          wget -q https://fy.chalmers.se/subatom/fastwigxj/fastwigxj-1.4.1.tar.gz -O fastwigxj.tar.gz
          tar -xzf fastwigxj.tar.gz && mv fastwigxj-1.4.1 fastwigxj
          make -C fastwigxj CC=gcc-12 CXX=g++-12 -j2
          cd ..
          ./ext/fastwigxj/bin/hash_js --max-E-3j=24 /dev/null ./test/test_data/table_24.3j
          ./ext/fastwigxj/bin/hash_js --max-E-6j=24 /dev/null ./test/test_data/table_24.6j
          make CC=gcc-12 BLAS=system OMP=0 tests -j2
          test -x bin/b4_test
      - name: Run frozen uniform multi-shell B4 fast-vs-accurate gate
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/external/sl2cfoam-next/lib
        run: |
          set -euo pipefail
          mkdir -p compute_out
          cd external/sl2cfoam-next
          ./bin/b4_test 2 2 2 2 '${{ matrix.two_l }}' '${{ matrix.two_l }}' '${{ matrix.two_l }}' '${{ matrix.two_l }}' '${{ matrix.gamma }}' acc | tee '../../compute_out/b4_g${{ matrix.gamma }}_dl${{ matrix.dl }}.log'
          cd ../..
          python experiments/sl2cfoam_b4_multishell_gate.py \
            --log 'compute_out/b4_g${{ matrix.gamma }}_dl${{ matrix.dl }}.log' \
            --gamma '${{ matrix.gamma }}' --dl '${{ matrix.dl }}' \
            --output 'compute_out/b4_g${{ matrix.gamma }}_dl${{ matrix.dl }}.json'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 'dvd-b4-multishell-g${{ matrix.gamma }}-dl${{ matrix.dl }}'
          path: compute_out/*
          if-no-files-found: warn

  aggregate:
    needs: multishell
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: 'dvd-b4-multishell-*'
          path: all
          merge-multiple: true
      - name: Aggregate frozen 12-lane gate
        run: |
          python - <<'PY'
          import glob,json,pathlib
          rows=[json.load(open(f)) for f in glob.glob('all/*.json')]
          rows=sorted(rows,key=lambda x:(x.get('gamma',0),x.get('delta_l',0)))
          ok=len(rows)==12 and all(x.get('gate_pass') for x in rows)
          out={'test':'LORENTZIAN_EPRL_DVD_B4_UNIFORM_MULTISHELL_AGGREGATE',
               'lane_count':len(rows),'all_pass':ok,
               'classification':'B4_MULTISHELL_NUMERICAL_KERNEL_PASS' if ok else 'B4_MULTISHELL_NUMERICAL_KERNEL_FAIL',
               'rows':[{'gamma':x.get('gamma'),'delta_l':x.get('delta_l'),'comparison_count':x.get('comparison_count'),'max_relative_error':x.get('max_relative_error'),'gate_pass':x.get('gate_pass')} for x in rows],
               'claim_lock':'Uniform-shell B4 numerical primitive only. No DVD2/DVD3 shell-sum convergence, refinement map, bridge, continuum or novelty claim.'}
          pathlib.Path('summary.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(json.dumps(out,indent=2,sort_keys=True))
          if not ok: raise SystemExit(2)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dvd-b4-multishell-summary
          path: summary.json
          if-no-files-found: error
