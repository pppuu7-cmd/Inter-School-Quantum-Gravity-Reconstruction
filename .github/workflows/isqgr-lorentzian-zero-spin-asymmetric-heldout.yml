name: ISQGR Lorentzian Zero Spin B4 Asymmetric Heldout
on:
  push:
    branches: [main]
    paths:
      - 'protocol/ITER006_LORENTZIAN_ZERO_SPIN_ASYMMETRIC_HELDOUT_PREREG.json'
      - '.github/workflows/isqgr-lorentzian-zero-spin-asymmetric-heldout.yml'
  workflow_dispatch:
permissions: {contents: read}
env:
  SL2CFOAM_SHA: '052e4346028870bd76f69a3034e6cae8defb8f7f'

jobs:
  gamma:
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        gamma: ['0.3','0.8','1.6','2.5','3.0']
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-12 g++-12 m4 lzip wget ca-certificates libgmp-dev libmpfr-dev libmpc-dev libgsl-dev libopenblas-dev libblas-dev libomp-dev
      - name: Checkout pinned sl2cfoam-next
        run: |
          git clone https://github.com/qg-cpt-marseille/sl2cfoam-next.git external/sl2cfoam-next
          git -C external/sl2cfoam-next checkout ${SL2CFOAM_SHA}
          test "$(git -C external/sl2cfoam-next rev-parse HEAD)" = "${SL2CFOAM_SHA}"
      - name: Build Wigner dependencies
        working-directory: external/sl2cfoam-next
        run: |
          set -euo pipefail
          mkdir -p ext test/test_data
          cd ext
          wget -q https://fy.chalmers.se/subatom/wigxjpf/wigxjpf-1.13.tar.gz -O wigxjpf.tar.gz
          tar -xzf wigxjpf.tar.gz && mv wigxjpf-1.13 wigxjpf
          make -C wigxjpf CC=gcc-12 -j2
          wget -q https://fy.chalmers.se/subatom/fastwigxj/fastwigxj-1.4.1.tar.gz -O fastwigxj.tar.gz
          tar -xzf fastwigxj.tar.gz && mv fastwigxj-1.4.1 fastwigxj
          make -C fastwigxj CC=gcc-12 CXX=g++-12 -j2
          cd ..
          ./ext/fastwigxj/bin/hash_js --max-E-3j=24 /dev/null ./test/test_data/table_24.3j
          ./ext/fastwigxj/bin/hash_js --max-E-6j=24 /dev/null ./test/test_data/table_24.6j
      - name: Build library then B4 test sequentially
        working-directory: external/sl2cfoam-next
        run: |
          set -euo pipefail
          make CC=gcc-12 BLAS=system OMP=0 lib -j2
          make CC=gcc-12 BLAS=system OMP=0 bin/b4_test -j1
          test -x bin/b4_test
      - name: Run frozen asymmetric one-zero-spin configurations
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/external/sl2cfoam-next/lib
        run: |
          set -euo pipefail
          mkdir -p compute_out
          cd external/sl2cfoam-next
          {
            echo '=== CONFIG A ==='; ./bin/b4_test 0 2 4 2 0 2 4 2 '${{ matrix.gamma }}' acc
            echo '=== CONFIG B ==='; ./bin/b4_test 2 0 2 4 2 0 2 4 '${{ matrix.gamma }}' acc
            echo '=== CONFIG C ==='; ./bin/b4_test 4 2 0 2 4 2 0 2 '${{ matrix.gamma }}' acc
            echo '=== CONFIG D ==='; ./bin/b4_test 2 4 2 0 2 4 2 0 '${{ matrix.gamma }}' acc
          } | tee '../../compute_out/heldout_zero_b4_${{ matrix.gamma }}.log'
          cd ../..
          python experiments/sl2cfoam_b4_zero_spin_gate.py --log 'compute_out/heldout_zero_b4_${{ matrix.gamma }}.log' --gamma '${{ matrix.gamma }}' --output 'compute_out/heldout_zero_b4_${{ matrix.gamma }}.json'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 'heldout-zero-spin-b4-gamma-${{ matrix.gamma }}'
          path: compute_out/*
          if-no-files-found: warn

  aggregate:
    needs: gamma
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: 'heldout-zero-spin-b4-gamma-*'
          path: all
          merge-multiple: true
      - name: Aggregate frozen held-out gate
        run: |
          python - <<'PY'
          import glob,json,pathlib
          rows=[json.load(open(f)) for f in glob.glob('all/*.json')]
          rows=sorted(rows,key=lambda x:x.get('gamma',0))
          ok=len(rows)==5 and all(x.get('gate_pass') for x in rows)
          out={'test':'PINNED_SL2CFOAM_B4_ZERO_SPIN_ASYMMETRIC_HELDOUT','lane_count':len(rows),'all_pass':ok,'classification':'B4_ZERO_SPIN_ASYMMETRIC_HELDOUT_PASS' if ok else 'B4_ZERO_SPIN_ASYMMETRIC_HELDOUT_NUMERICAL_VALIDITY_FAIL','by_gamma':[{'gamma':x.get('gamma'),'comparison_count':x.get('comparison_count'),'max_relative_error':x.get('max_relative_error'),'gate_pass':x.get('gate_pass')} for x in rows],'claim_lock':'Primitive numerical robustness only; no refined-foam identity, cylindrical consistency, convergence or bridge claim.'}
          pathlib.Path('summary.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n');print(json.dumps(out,indent=2,sort_keys=True))
          if not ok: raise SystemExit(2)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: heldout-zero-spin-b4-summary
          path: summary.json
          if-no-files-found: error
