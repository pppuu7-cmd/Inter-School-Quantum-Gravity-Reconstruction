name: ISQGR Iter009 RC006 Eq24 TNR authority gate
on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/isqgr_iter009_rc006_eq24_tnr_gate.yml'
  workflow_dispatch:

jobs:
  lanes:
    strategy:
      fail-fast: false
      matrix:
        lane: [A, B, C, D]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run frozen lane
        run: |
          mkdir -p out
          python code/iter009_rc006_eq24_tnr_gate.py --lane ${{ matrix.lane }} | tee out/lane_${{ matrix.lane }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: iter009-lane-${{ matrix.lane }}
          path: out/lane_${{ matrix.lane }}.json

  aggregate:
    needs: lanes
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: iter009-lane-*
          merge-multiple: true
          path: out
      - name: Frozen aggregate
        run: |
          python - <<'PY' | tee out/aggregate.json
          import json,glob
          fs=sorted(glob.glob('out/lane_*.json'))
          rows=[json.load(open(f)) for f in fs]
          ok=len(rows)==4 and {r['lane'] for r in rows}==set('ABCD') and all(r.get('pass') is True for r in rows)
          label='RC006_EQ24_TNR_OBJECT_SOURCE_PINNED_NORMALIZATION_FAMILY_OPEN_SCOPED' if ok else 'ITER009_FROZEN_GATE_FAIL'
          print(json.dumps({'classification':label,'pass':ok,'lane_count':len(rows),'lanes':rows},indent=2,sort_keys=True))
          raise SystemExit(0 if ok else 2)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iter009-summary
          path: out/aggregate.json
