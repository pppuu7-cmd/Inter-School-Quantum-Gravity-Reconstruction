name: ISQGR Causal-Set Closure Boundary Refine 1.25-1.50

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/isqgr-causal-set-boundary-refine-125-150.yml'
      - 'experiments/causal_set_heterogeneous_mass_composition.py'

permissions:
  contents: read

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        n: [384, 512, 768]
        seed: [93, 94, 101, 102]
        pair:
          - '0.0,1.3125'
          - '1.3125,0.0'
          - '0.0,1.3750'
          - '1.3750,0.0'
          - '0.0,1.4375'
          - '1.4375,0.0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip numpy scipy
      - name: Run predeclared transition refinement
        run: |
          set -euo pipefail
          MU1="${{ matrix.pair }}"; MU1="${MU1%%,*}"
          MU2="${{ matrix.pair }}"; MU2="${MU2##*,}"
          python experiments/causal_set_heterogeneous_mass_composition.py \
            --n ${{ matrix.n }} --seed ${{ matrix.seed }} --mu1 "$MU1" --mu2 "$MU2" --n-random 96 \
            --output "compute_out/n${{ matrix.n }}_s${{ matrix.seed }}_${MU1}_${MU2}.json"
      - uses: actions/upload-artifact@v4
        with:
          name: causal-refine-${{ matrix.n }}-${{ matrix.seed }}-${{ strategy.job-index }}
          path: compute_out/*.json
          if-no-files-found: error

  aggregate:
    if: always()
    needs: [sweep]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: campaign
          merge-multiple: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Aggregate refined transition
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,pathlib,statistics
          rows=[json.loads(p.read_text()) for p in pathlib.Path('campaign').glob('*.json')]
          if not rows: raise SystemExit('no successful case artifacts')
          out={'test':'CAUSAL_SET_CLOSURE_BOUNDARY_REFINE_125_150','n_success_jobs':len(rows),'by_pair':{},
               'claim_lock':'Second-stage preregistered refinement within the independently bracketed 1.25-1.50 crossing region. This estimates the control-advantage transition of the frozen massless projector only.'}
          for pair in sorted({(r['mu1'],r['mu2']) for r in rows}):
              g=[r for r in rows if (r['mu1'],r['mu2'])==pair]
              vals=[x['improvement']['random_mean_over_source_return'] for x in g]
              fr=[x['random_controls']['fraction_random_worse_return'] for x in g]
              out['by_pair'][f'{pair[0]}->{pair[1]}']={
                'n_success':len(g),'mean_return_improvement':statistics.fmean(vals),
                'median_return_improvement':statistics.median(vals),'min_return_improvement':min(vals),
                'max_return_improvement':max(vals),'fraction_cases_return_improvement_gt_1':sum(v>1 for v in vals)/len(vals),
                'mean_fraction_random_worse_return':statistics.fmean(fr)}
          pathlib.Path('causal_set_closure_boundary_refine_125_150_summary.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(json.dumps(out,indent=2,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: isqgr-causal-set-closure-boundary-refine-125-150-summary
          path: causal_set_closure_boundary_refine_125_150_summary.json
          if-no-files-found: error

