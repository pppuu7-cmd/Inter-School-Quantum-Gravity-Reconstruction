name: ISQGR Iter011 RC006 Eq27 AppendixF qCG authority gate
on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/isqgr_iter011_rc006_eq27_appendixf_qcg_authority_gate.yml'
  workflow_dispatch:

jobs:
  lanes:
    strategy:
      fail-fast: false
      matrix:
        lane: [A, B, C, D]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run frozen source-authority lane
        run: |
          mkdir -p out
          python code/iter011_rc006_eq27_appendixf_qcg_authority_gate.py --lane ${{ matrix.lane }} | tee out/lane_${{ matrix.lane }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iter011-lane-${{ matrix.lane }}
          path: out/lane_${{ matrix.lane }}.json

  aggregate:
    needs: lanes
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: iter011-lane-*
          merge-multiple: true
          path: out
      - name: Frozen aggregate
        run: |
          python - <<'PY' | tee out/aggregate.json
          import json,glob
          fs=sorted(glob.glob('out/lane_*.json')); rows=[]
          for f in fs:
              try: rows.append(json.load(open(f)))
              except Exception as e: rows.append({'lane':f,'pass':False,'parse_error':str(e)})
          ok=len(rows)==4 and {r.get('lane') for r in rows}==set('ABCD') and all(r.get('pass') is True for r in rows)
          label='RC006_EQ27_APPENDIXF_NUMERICAL_AUTHORITY_CHAIN_COMPLETE_SCOPED' if ok else 'RC006_EQ27_APPENDIXF_NUMERICAL_AUTHORITY_CHAIN_BLOCKED'
          print(json.dumps({'classification':label,'pass':ok,'lane_count':len(rows),'lanes':rows},indent=2,sort_keys=True))
          raise SystemExit(0 if ok else 2)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iter011-summary
          path: out/aggregate.json
