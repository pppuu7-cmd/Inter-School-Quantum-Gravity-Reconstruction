name: ISQGR Fusion-Basis SVD Invariant Audit

on:
  push:
    branches: [main]
    paths:
      - 'experiments/fusion_basis_svd_invariants.py'
      - '.github/workflows/isqgr-fusion-basis-svd-invariants.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  svd-flow:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        g: ['0.0','0.25','0.5','0.75','1.0','1.15']
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.10'
      - name: Clone pinned source
        run: |
          set -euo pipefail
          git clone https://github.com/ssteinhaus/Fusion-basis-coarse-graining.git external/Fusion-basis-coarse-graining
          git -C external/Fusion-basis-coarse-graining checkout bb4d1adb1aa81e5090f3ef25a3b9fb8845f19ff4
          test "$(git -C external/Fusion-basis-coarse-graining rev-parse HEAD)" = "bb4d1adb1aa81e5090f3ef25a3b9fb8845f19ff4"
      - name: Freeze five RG iterations and disable autorun
        working-directory: external/Fusion-basis-coarse-graining/half_int/no_torsion
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('Fusion_vec.jl'); s=p.read_text()
          s,n=re.subn(r'iterations\s*=\s*\d+\s*;', 'iterations = 5;', s, count=1)
          if n!=1: raise SystemExit(f'iteration patch count={n}')
          s=s.replace('@time main_vec(1.15)','',1)
          p.write_text(s)
          PY
      - name: Execute amplitude-level RG flow
        working-directory: external/Fusion-basis-coarse-graining/half_int/no_torsion
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/compute_out"
          julia -L Fusion_vec.jl -e 'Fusion.main_vec(parse(Float64, ARGS[1]));' '${{ matrix.g }}' \
            > "$GITHUB_WORKSPACE/compute_out/fusion_${{ matrix.g }}.log" 2>&1
          grep -q 'Iteration 5' "$GITHUB_WORKSPACE/compute_out/fusion_${{ matrix.g }}.log"
      - name: Extract preregistered SVD-flow invariants
        run: |
          python experiments/fusion_basis_svd_invariants.py \
            --log 'compute_out/fusion_${{ matrix.g }}.log' --g '${{ matrix.g }}' --iterations 5 \
            --output 'compute_out/invariants_${{ matrix.g }}.json'
      - uses: actions/upload-artifact@v4
        with:
          name: fusion-svd-g-${{ matrix.g }}
          path: compute_out/
          if-no-files-found: error

  aggregate:
    if: always()
    needs: [svd-flow]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: fusion-svd-g-*
          path: campaign
      - name: Aggregate coupling controls
        run: |
          python3 - <<'PY'
          import json,pathlib
          fs=sorted(pathlib.Path('campaign').glob('**/invariants_*.json'))
          ds=[json.loads(p.read_text()) for p in fs]
          out={'test':'FUSION_BASIS_SVD_INVARIANT_AGGREGATE','lane_count':len(ds),
               'all_six_present':len(ds)==6,
               'persistent_multisector_fraction':sum(d['persistent_multisector_envelope_1e2'] for d in ds)/len(ds) if ds else None,
               'both_flows_contract_fraction':sum(d['first_svd_flow_contracts_last_vs_first'] and d['second_svd_flow_contracts_last_vs_first'] for d in ds)/len(ds) if ds else None,
               'by_coupling':[{'g':d['g'],'persistent_envelope':d['persistent_multisector_envelope_1e2'],'first_contract':d['first_svd_flow_contracts_last_vs_first'],'second_contract':d['second_svd_flow_contracts_last_vs_first'],'first_last_flow':d['first_svd_normalized_flow_l2'][-1] if d['first_svd_normalized_flow_l2'] else None,'second_last_flow':d['second_svd_normalized_flow_l2'][-1] if d['second_svd_normalized_flow_l2'] else None} for d in ds],
               'claim_lock':'Nearest-framework TNR control. Generic SVD envelope persistence weakens uniqueness of envelope language; it does not test a source-native gravity selector or derive the ISQGR bridge.'}
          pathlib.Path('fusion_svd_invariant_summary.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(json.dumps(out,indent=2,sort_keys=True))
          if len(ds)!=6: raise SystemExit('missing coupling lanes')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: fusion-svd-invariant-summary
          path: fusion_svd_invariant_summary.json
          if-no-files-found: error
