name: ITER127 strict Frob same-equation source assertions

on:
  push:
    branches: [main]
    paths:
      - 'analysis/iter127_assert_frob_initial_tangent_coeffs_v2.py'
      - '.github/workflows/iter127_frob_initial_tangent_coeffs_v2.yml'
      - 'prereg/ITER127_FIXED_GEODESIC_CHI1_CHI2_PROJECTED_SINGULAR_STRATA_AUTHORITY_2026-09-15.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  strict-source-assertions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download exact arXiv source package
        run: |
          mkdir -p /tmp/iter127-src artifacts/iter127-strict
          curl -L --fail --retry 4 --retry-delay 3 \
            https://arxiv.org/e-print/1706.01891 \
            -o /tmp/1706.01891.tar
          tar -xf /tmp/1706.01891.tar -C /tmp/iter127-src
      - name: Run strict same-equation assertions
        run: |
          python analysis/iter127_assert_frob_initial_tangent_coeffs_v2.py \
            --source-dir /tmp/iter127-src \
            --out artifacts/iter127-strict
      - name: Upload strict source evidence
        uses: actions/upload-artifact@v4
        with:
          name: iter127-frob-strict-source-assertions
          path: artifacts/iter127-strict/
          if-no-files-found: error
