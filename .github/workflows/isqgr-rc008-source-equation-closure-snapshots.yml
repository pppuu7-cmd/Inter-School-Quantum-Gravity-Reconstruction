name: ISQGR RC008 Source Equation Closure Snapshots

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/isqgr-rc008-source-equation-closure-snapshots.yml'
  workflow_dispatch:

permissions: {contents: read}

jobs:
  snapshot:
    strategy:
      fail-fast: false
      max-parallel: 9
      matrix:
        include:
          - {arxiv: '1508.07961', label: 'Eq:CoherentInterwiner', key: coherent}
          - {arxiv: '1508.07961', label: 'Eq:ComplexAction', key: action}
          - {arxiv: '1508.07961', label: 'Eq:OffDiagonalHessian', key: hessian}
          - {arxiv: '1508.07961', label: 'Eq:SolutionVector', key: solution}
          - {arxiv: '1508.07961', label: 'Eq:StateSum', key: statesum}
          - {arxiv: '1701.02311', label: 'Eq:EmbeddingMaps', key: embedding}
          - {arxiv: '1701.02311', label: 'Eq:RenormalizedAmplitude_abstract', key: renormabstract}
          - {arxiv: '1701.02311', label: 'Eq:RenormalizedAmplitude', key: renorm}
          - {arxiv: '1701.02311', label: 'Eq:Observable', key: observable}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Fetch official arXiv source
        run: |
          set -euo pipefail; mkdir -p external/arxiv_src
          (curl -fL --retry 3 --retry-delay 2 'https://export.arxiv.org/e-print/${{ matrix.arxiv }}' -o /tmp/src.tar || curl -fL --retry 3 --retry-delay 2 'https://arxiv.org/e-print/${{ matrix.arxiv }}' -o /tmp/src.tar)
          tar -xf /tmp/src.tar -C external/arxiv_src
      - name: Snapshot dependency equation
        run: |
          mkdir -p compute_out
          python experiments/rc008_source_equation_snapshot.py --source-dir external/arxiv_src --label '${{ matrix.label }}' --output 'compute_out/${{ matrix.key }}.json'
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: 'rc008-closure-snapshot-${{ matrix.key }}', path: 'compute_out/*.json', if-no-files-found: error}
  aggregate:
    needs: snapshot
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: {pattern: 'rc008-closure-snapshot-*', path: all, merge-multiple: true}
      - name: Frozen closure-snapshot gate
        run: |
          python - <<'PY'
          import glob,json,pathlib,sys
          rows=[json.load(open(f)) for f in sorted(glob.glob('all/*.json'))]
          ok=len(rows)==9 and all(r.get('frozen_gate_pass') for r in rows)
          out={'test':'RC008_SOURCE_EQUATION_CLOSURE_SNAPSHOT_AGGREGATE','lane_count':len(rows),'frozen_gate_pass':ok,'claim_lock':'Implementation inputs only; no numerical amplitude or refinement result.'}
          pathlib.Path('summary.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n');print(json.dumps(out,indent=2,sort_keys=True));sys.exit(0 if ok else 2)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: rc008-source-equation-closure-summary, path: summary.json, if-no-files-found: error}
