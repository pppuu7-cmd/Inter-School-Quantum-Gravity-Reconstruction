name: ISQGR Lorentzian EPRL Partial-Slice Closure

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/isqgr-eprl-partial-slice-closure.yml'
      - 'experiments/eprl_partial_slice_closure.jl'

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-12 g++-12 m4 lzip wget ca-certificates libgmp-dev libmpfr-dev libmpc-dev libgsl-dev libopenblas-dev libblas-dev libomp-dev
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.11'
      - name: Install Julia dependencies
        run: julia -e 'using Pkg; Pkg.add("HalfIntegers"); Pkg.precompile()'
      - name: Checkout pinned sl2cfoam-next
        run: |
          git clone https://github.com/qg-cpt-marseille/sl2cfoam-next.git external/sl2cfoam-next
          git -C external/sl2cfoam-next checkout 052e4346028870bd76f69a3034e6cae8defb8f7f
      - name: Build Wigner dependencies
        working-directory: external/sl2cfoam-next
        run: |
          mkdir -p ext
          cd ext
          wget -q https://fy.chalmers.se/subatom/wigxjpf/wigxjpf-1.13.tar.gz -O wigxjpf.tar.gz
          tar -xzf wigxjpf.tar.gz && mv wigxjpf-1.13 wigxjpf
          make -C wigxjpf CC=gcc-12 -j2
          wget -q https://fy.chalmers.se/subatom/fastwigxj/fastwigxj-1.4.1.tar.gz -O fastwigxj.tar.gz
          tar -xzf fastwigxj.tar.gz && mv fastwigxj-1.4.1 fastwigxj
          make -C fastwigxj CC=gcc-12 CXX=g++-12 -j2
      - name: Precompute Wigner tables and build library
        working-directory: external/sl2cfoam-next
        run: |
          mkdir -p data_sl2cfoam
          ./ext/fastwigxj/bin/hash_js --max-E-3j=20 /dev/null ./data_sl2cfoam/table_20.3j
          ./ext/fastwigxj/bin/hash_js --max-E-6j=20 /dev/null ./data_sl2cfoam/table_20.6j
          make CC=gcc-12 BLAS=system OMP=0 lib -j2
      - name: Run partial-slice closure benchmark
        env:
          SL2CFOAM_ROOT: ${{ github.workspace }}/external/sl2cfoam-next
          LD_LIBRARY_PATH: ${{ github.workspace }}/external/sl2cfoam-next/lib
        run: |
          set -euo pipefail
          mkdir -p compute_out
          julia experiments/eprl_partial_slice_closure.jl | tee compute_out/eprl_partial_slice_closure.txt
          grep -q '^EPRL_PARTIAL_SLICE_CLOSURE=PASS$' compute_out/eprl_partial_slice_closure.txt
          test -s compute_out/eprl_partial_slice_closure.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: isqgr-eprl-partial-slice-closure
          path: compute_out/
          if-no-files-found: warn
