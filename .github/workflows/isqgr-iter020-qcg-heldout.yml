name: ISQGR Iter020 held-out q-CG transport

on:
  push:
    branches: [main]
    paths:
      - 'code/iter020/**'
      - '.github/workflows/isqgr-iter020-qcg-heldout.yml'
      - 'triggers/iter020.txt'
  workflow_dispatch:

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        lane: [level-transport, near-cutoff, heldout-recoupling, null-calibration]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pin numerical runtime
        run: pip install 'numpy==2.3.3' 'mpmath==1.3.0'
      - name: Run preregistered lane
        run: python code/iter020/qcg_heldout_transport.py --lane '${{ matrix.lane }}'
      - name: Upload raw lane evidence
        uses: actions/upload-artifact@v4
        with:
          name: iter020-${{ matrix.lane }}
          path: out/evidence.json

  aggregate:
    needs: validate
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: iter020-*
          path: lanes
      - name: Frozen aggregate
        run: |
          python - <<'PY'
          import json,glob,os
          files=glob.glob('lanes/**/evidence.json',recursive=True)
          ev=[json.load(open(f)) for f in files]
          expected={'level-transport','near-cutoff','heldout-recoupling','null-calibration'}
          got={x.get('lane') for x in ev}
          infra=(got!=expected) or any(x.get('infrastructure_failure') for x in ev)
          passes={x.get('lane'):bool(x.get('pass')) for x in ev}
          if infra: cls='RC006_QCG_HELDOUT_INFRASTRUCTURE_PARTIAL'
          elif all(passes.get(x,False) for x in expected): cls='RC006_QCG_HELDOUT_TRANSPORT_PASS'
          elif not passes.get('level-transport',False): cls='RC006_QCG_LEVEL_TRANSPORT_FAIL'
          elif not passes.get('near-cutoff',False): cls='RC006_QCG_NEAR_CUTOFF_FAIL'
          elif not passes.get('heldout-recoupling',False): cls='RC006_QCG_HELDOUT_RECOUPLING_FAIL'
          else: cls='RC006_QCG_NULL_CALIBRATION_FAIL'
          out={'classification':cls,'lane_pass':passes,'bridge_credit':False,'candidate_theory_authorized':False,'iter012_retry_authorized':False,'eq29_amplitude_authorized':False,'preferred_alpha_found':False,'lanes':ev}
          os.makedirs('aggregate',exist_ok=True)
          json.dump(out,open('aggregate/aggregate.json','w'),indent=2,sort_keys=True)
          print(json.dumps(out,indent=2,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: iter020-aggregate
          path: aggregate/aggregate.json
