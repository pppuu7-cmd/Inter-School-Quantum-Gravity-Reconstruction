name: ISQGR Iter026 direct source qbar identity

on:
  push:
    branches: [main]
    paths:
      - 'code/iter026/**'
      - '.github/workflows/isqgr-iter026-direct-source-qbar.yml'
      - 'triggers/iter026.txt'
  workflow_dispatch:

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        lane: [domain, algebra, cup, four, null]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check 'numpy==2.3.3' 'mpmath==1.3.0'
      - name: Run frozen ITER026 lane
        run: python code/iter026/direct_source_qbar_identity.py --lane '${{ matrix.lane }}'
      - uses: actions/upload-artifact@v4
        with:
          name: iter026-${{ matrix.lane }}
          path: out/iter026/evidence.json

  aggregate:
    needs: validate
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: iter026-*
          path: lanes
          merge-multiple: false
      - name: Frozen ITER026 aggregate
        run: |
          python - <<'PY'
          import json,pathlib
          rows=[]
          for p in sorted(pathlib.Path('lanes').glob('*/evidence.json')):
              try: rows.append(json.loads(p.read_text()))
              except Exception as exc: rows.append({'lane':str(p.parent),'aggregate_read_error':repr(exc),'pass':False})
          expected=['domain','algebra','cup','four','null']
          by={r.get('lane'):r for r in rows}
          infra=set(by)!=set(expected) or any(r.get('infrastructure_failure') or r.get('aggregate_read_error') for r in rows)
          invalid=False
          if not infra:
              d=by['domain']; a=by['algebra']; c=by['cup']; f=by['four']; n=by['null']
              invalid = not (
                  d.get('coverage_ok') is True and d.get('planned_cup_case_count')==55 and d.get('expected_cup_case_count')==55 and
                  a.get('inverse_parameter_qbar_solver_used_for_construction') is False and a.get('per_channel_posthoc_repair') is False and
                  c.get('case_count')==55 and len(c.get('known_counterexamples',[]))==8 and
                  f.get('heldout_levels')==[7,9,11] and
                  n.get('required')==3 and n.get('legacy_comparator_used_for_construction') is False
              )
          if infra:
              cls='RC006_DIRECT_SOURCE_QBAR_INFRASTRUCTURE_FAIL'
          elif invalid:
              cls='INVALID_IMPLEMENTATION'
          elif by['domain'].get('blocked_source_authority'):
              cls='BLOCKED_SOURCE_AUTHORITY'
          elif by['domain'].get('authority_ok') is not True:
              cls='BLOCKED_SOURCE_AUTHORITY'
          elif by['domain'].get('source_domain_ok') is not True:
              cls='BLOCKED_SOURCE_DOMAIN'
          elif by['domain'].get('pass') is not True:
              cls='BLOCKED_SOURCE_DOMAIN'
          elif by['algebra'].get('pass') is not True:
              cls='RC006_DIRECT_SOURCE_QBAR_ALGEBRA_FAIL'
          elif by['cup'].get('pass') is not True:
              cls='RC006_DIRECT_SOURCE_QBAR_CUP_FAIL'
          elif by['four'].get('pass') is not True:
              cls='RC006_DIRECT_SOURCE_QBAR_4VALENT_FAIL'
          elif by['null'].get('pass') is not True:
              cls='RC006_DIRECT_SOURCE_QBAR_NULL_FAIL'
          else:
              cls='RC006_DIRECT_SOURCE_QBAR_PRIMITIVE_VALIDATED'
          full_pass=cls=='RC006_DIRECT_SOURCE_QBAR_PRIMITIVE_VALIDATED'
          out={
              'classification':cls,
              'lane_pass':{x:bool(by.get(x,{}).get('pass')) for x in expected},
              'lanes':rows,
              'eq27_component_reconstruction_prereg_allowed':full_pass,
              'iter012_retry_authorized':False,
              'eq29_amplitude_authorized':False,
              'one_step_tnr_authorized':False,
              'bridge_credit':False,
              'candidate_theory_authorized':False,
              'new_physics_found':False,
              'candidate_theory':'UNFORMED',
          }
          pathlib.Path('aggregate.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(json.dumps(out,indent=2,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: iter026-aggregate
          path: aggregate.json
