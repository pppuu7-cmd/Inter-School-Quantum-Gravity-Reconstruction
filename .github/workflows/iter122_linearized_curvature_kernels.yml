name: ITER122 linearized curvature kernels

on:
  push:
    branches: [main]
    paths:
      - 'prereg/ITER122_LINEARIZED_CURVATURE_GENUINE_DEFECT_KERNEL_REDUCTION_2026-09-15.md'
      - 'analysis/iter122_linearized_curvature_kernels_v2.py'
      - '.github/workflows/iter122_linearized_curvature_kernels.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  symbolic-kernel-reduction:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install symbolic dependency
        run: python -m pip install --disable-pip-version-check sympy==1.13.3
      - name: Run ITER122 authoritative v2 reduction
        run: python analysis/iter122_linearized_curvature_kernels_v2.py
      - name: Upload symbolic outputs
        uses: actions/upload-artifact@v4
        with:
          name: iter122-linearized-curvature-kernels
          path: artifacts/iter122/
          if-no-files-found: error
