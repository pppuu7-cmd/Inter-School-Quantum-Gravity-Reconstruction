name: ITER136 geodesic response completion
on:
  push:
    paths:
      - '.github/workflows/iter136_geodesic_response_completion.yml'
  workflow_dispatch:
jobs:
  completion-audit:
    strategy:
      fail-fast: false
      matrix:
        lane: [first-order-line-response, heldout-direct-expansion]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install sympy
      - run: python analysis/iter136_geodesic_response_completion.py --lane ${{ matrix.lane }} | tee iter136-${{ matrix.lane }}.log
      - uses: actions/upload-artifact@v4
        with:
          name: iter136-${{ matrix.lane }}
          path: |
            iter136_${{ matrix.lane }}.json
            iter136-${{ matrix.lane }}.log
