name: ISQGR Iter013 RC006 generic q-CG authority

on:
  push:
    paths:
      - '.github/workflows/isqgr_iter013_rc006_generic_qcg_authority.yml'
      - 'prereg/ITER013_RC006_GENERIC_QCG_AUTHORITY_AND_NORMALIZATION.md'

permissions:
  contents: read

jobs:
  audit:
    strategy:
      fail-fast: false
      matrix:
        lane: [main-authority, prior-1312, prior-1506, cap-cup]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Fetch immutable versioned arXiv source
        shell: bash
        run: |
          set -euo pipefail
          case '${{ matrix.lane }}' in
            main-authority|cap-cup) ID='1609.02429v2' ;;
            prior-1312) ID='1312.0905v2' ;;
            prior-1506) ID='1506.04749v3' ;;
          esac
          curl -L --fail --retry 4 --retry-delay 2 "https://export.arxiv.org/e-print/${ID}" -o source.archive
          sha256sum source.archive | tee source.sha256
          mkdir src
          if tar -tf source.archive >/dev/null 2>&1; then
            tar -xf source.archive -C src
          elif gzip -t source.archive >/dev/null 2>&1; then
            gzip -dc source.archive > src/source.tex
          else
            cp source.archive src/source.tex
          fi
          find src -type f -name '*.tex' -print0 | sort -z | xargs -0 cat > source_all.tex
          test -s source_all.tex
      - name: Extract frozen q-CG evidence
        env:
          LANE: ${{ matrix.lane }}
        shell: bash
        run: |
          python - <<'PY'
          import json, os, pathlib, re
          lane=os.environ['LANE']
          text=pathlib.Path('source_all.tex').read_text(errors='ignore')
          low=text.lower()
          sha=pathlib.Path('source.sha256').read_text().split()[0]
          def contexts(patterns, radius=450, limit=12):
              hits=[]
              for p in patterns:
                  for m in re.finditer(p,text,re.I|re.S):
                      a=max(0,m.start()-radius); b=min(len(text),m.end()+radius)
                      s=re.sub(r'\s+',' ',text[a:b])
                      if s not in hits: hits.append(s)
                      if len(hits)>=limit: return hits
              return hits
          delegation=(('biedenharn' in low and 'lohe' in low) and
                      bool(re.search(r'not\s+the\s+standard\s+clebsch.{0,100}defined\s+in',low,re.S)))
          formula_tokens=['qfactorial','q-factorial','q factorial','qbinom','q-binomial','hypergeometric']
          explicit_formula_candidate=any(t in low for t in formula_tokens) and bool(re.search(r'clebsch',low))
          common={
            'lane':lane,'source_sha256':sha,
            'clebsch_mentions':len(re.findall(r'clebsch',low)),
            'biedenharn_lohe_reference':('biedenharn' in low and 'lohe' in low),
            'standard_coefficient_delegation_detected':delegation,
            'explicit_generic_formula_candidate':explicit_formula_candidate,
            'anchors':contexts([r'not\s+the\s+standard\s+Clebsch.{0,120}defined\s+in',r'Clebsch.{0,120}Gordan',r'Biedenharn.{0,100}Lohe'])
          }
          if lane=='main-authority':
              common.update({
                'coproduct_A5_signal':bool(re.search(r'co.?product|coproduct',low)) and ('delta' in low or '\\Delta' in text),
                'decomposition_A6_signal':bool(re.search(r'decompos.{0,300}clebsch',low,re.S)),
                'orthogonality_A9_signal':'orthogonality relation' in low,
                'cap_signal':"call `cap'" in low or "call 'cap'" in low or 'call \`cap' in low,
                'cup_identity_signal':'give the identity if we concatenate them' in low,
                'qbar_dual_signal':('inverse' in low and 'complex conjugate' in low and 'deformation parameter' in low),
              })
          elif lane=='cap-cup':
              cap_ctx=contexts([r'call\s+[`\'\"]?cap',r'j_?3\s*=\s*0'],900,8)
              cup_ctx=contexts([r'give\s+the\s+identity\s+if\s+we\s+concatenate',r'call\s+[`\'\"]?cup'],900,8)
              joined=' '.join(cap_ctx)
              dim_factor=bool(re.search(r'(?:sqrt|\\sqrt).{0,60}d_?\{?j\}?',joined,re.I|re.S))
              common.update({
                'cap_contexts':cap_ctx,'cup_contexts':cup_ctx,
                'cap_explicit_quantum_dimension_factor_signal':dim_factor,
                'cap_cup_identity_requirement_signal':'give the identity if we concatenate them' in low,
                'euclidean_abs_square_norm_stated':bool(re.search(r'(absolute|modulus).{0,80}(square|squared).{0,100}cap',low,re.S)),
                'subclassification':'CAP_CUP_NORMALIZATION_IDENTITY_SOURCE_QUALIFIED' if (dim_factor and 'give the identity if we concatenate them' in low) else 'CAP_CUP_NORMALIZATION_AMBIGUOUS'
              })
          pathlib.Path('evidence.json').write_text(json.dumps(common,indent=2,sort_keys=True)+'\n')
          print(json.dumps(common,indent=2,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: iter013-${{ matrix.lane }}
          path: evidence.json
          if-no-files-found: error

  aggregate:
    needs: audit
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: iter013-*
          path: inputs
          merge-multiple: false
      - name: Frozen aggregate classification
        shell: bash
        run: |
          python - <<'PY' | tee summary.json
          import glob,json
          rows=[]
          for f in sorted(glob.glob('inputs/**/evidence.json',recursive=True)):
              try: rows.append(json.load(open(f)))
              except Exception as e: rows.append({'lane':f,'parse_error':str(e)})
          by={r.get('lane'):r for r in rows}
          need={'main-authority','prior-1312','prior-1506','cap-cup'}
          if set(by)!=need:
              cls='INFRASTRUCTURE_SOURCE_EXTRACTION_FAIL'; code=2
          else:
              opens=[by[x] for x in ('main-authority','prior-1312','prior-1506')]
              if any(r.get('explicit_generic_formula_candidate') for r in opens):
                  cls='RC006_GENERIC_QCG_EXPLICIT_FORMULA_CANDIDATE_REQUIRES_MANUAL_SOURCE_VALIDATION'; code=0
              elif all(r.get('standard_coefficient_delegation_detected') and r.get('biedenharn_lohe_reference') for r in opens):
                  cls='RC006_GENERIC_QCG_EXTERNAL_BOOK_AUTHORITY_REQUIRED'; code=0
              else:
                  cls='RC006_GENERIC_QCG_AUTHORITY_PARTIAL'; code=0
          cap=by.get('cap-cup',{}).get('subclassification','INFRASTRUCTURE_SOURCE_EXTRACTION_FAIL')
          out={'classification':cls,'cap_cup_classification':cap,'lanes':rows,
               'iter012_retry_authorized':False,'qcg_implementation_authorized':False,
               'eq29_amplitude_authorized':False,'bridge_credit':False,'candidate_theory_authorized':False}
          print(json.dumps(out,indent=2,sort_keys=True))
          raise SystemExit(code)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: iter013-summary
          path: summary.json
          if-no-files-found: error
