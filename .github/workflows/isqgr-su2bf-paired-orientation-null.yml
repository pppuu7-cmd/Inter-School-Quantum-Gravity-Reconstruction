name: ISQGR SU2BF Paired Orientation Null

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/isqgr-su2bf-paired-orientation-null.yml'
      - 'experiments/su2bf_paired_orientation_null.jl'

permissions:
  contents: read

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        spin: ['3.0','4.5','6.0']
        pair:
          - 'swap_one,cycle_two'
          - 'cycle_two,swap_one'
          - 'swap_one,mixed_three'
          - 'mixed_three,swap_one'
          - 'cycle_two,mixed_three'
          - 'mixed_three,cycle_two'
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.11'
      - name: Install Julia dependencies
        run: julia -e 'using Pkg; Pkg.add(["HalfIntegers","WignerSymbols","Memoize","Combinatorics","JSON3"]); Pkg.precompile()'
      - name: Checkout pinned source realization
        run: |
          git clone https://github.com/sethkasante/su2bf-TNAlgo.git external/su2bf-TNAlgo
          git -C external/su2bf-TNAlgo checkout 2460cda77b8fe27a4106e98bf39a94fa9059bc92
      - name: Run paired unitary orientation null
        env:
          SU2BF_ROOT: external/su2bf-TNAlgo
        run: |
          set -euo pipefail
          FIRST="${{ matrix.pair }}"; FIRST="${FIRST%%,*}"
          SECOND="${{ matrix.pair }}"; SECOND="${SECOND##*,}"
          julia experiments/su2bf_paired_orientation_null.jl ${{ matrix.spin }} "$FIRST" "$SECOND" 20260917 96 \
            "compute_out/j${{ matrix.spin }}_${FIRST}_${SECOND}.json"
      - uses: actions/upload-artifact@v4
        with:
          name: su2bf-orient-null-${{ matrix.spin }}-${{ strategy.job-index }}
          path: compute_out/*.json
          if-no-files-found: error

  aggregate:
    if: always()
    needs: [sweep]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: campaign
          merge-multiple: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Aggregate orientation-null test
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,pathlib,statistics
          cases=[json.loads(p.read_text())['result'] for p in pathlib.Path('campaign').glob('*.json')]
          if not cases: raise SystemExit('no case artifacts')
          ranks=[(c,r) for c in cases for r in c['ranks']]
          out={'test':'SU2BF_PAIRED_UNITARY_ORIENTATION_NULL_AGGREGATE','n_cases':len(cases),'n_rank_tests':len(ranks),'by_spin':{},
               'overall':{
                 'median_return_improvement':statistics.median(r['return_improvement'] for c,r in ranks),
                 'mean_return_improvement':statistics.fmean(r['return_improvement'] for c,r in ranks),
                 'min_return_improvement':min(r['return_improvement'] for c,r in ranks),
                 'fraction_return_improvement_gt_1':sum(r['return_improvement']>1 for c,r in ranks)/len(ranks),
                 'fraction_null_worse_return_gt_half':sum(r['fraction_null_worse_return']>0.5 for c,r in ranks)/len(ranks)},
               'claim_lock':'Shared unitary-similarity null preserves each holdout singular spectrum and pair structure while scrambling alignment to the frozen train projector. No QG-model claim follows.'}
          for j in sorted({c['spin'] for c in cases}):
              rs=[r for c,r in ranks if c['spin']==j]
              out['by_spin'][str(j)]={'n_rank_tests':len(rs),'median_return_improvement':statistics.median(r['return_improvement'] for r in rs),
                'mean_return_improvement':statistics.fmean(r['return_improvement'] for r in rs),
                'fraction_return_improvement_gt_1':sum(r['return_improvement']>1 for r in rs)/len(rs),
                'fraction_null_worse_return_gt_half':sum(r['fraction_null_worse_return']>0.5 for r in rs)/len(rs)}
          pathlib.Path('su2bf_paired_orientation_null_summary.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(json.dumps(out,indent=2,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: isqgr-su2bf-paired-orientation-null-summary
          path: su2bf_paired_orientation_null_summary.json
          if-no-files-found: error

