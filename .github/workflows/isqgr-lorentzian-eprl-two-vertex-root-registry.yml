name: ISQGR Lorentzian EPRL Two Vertex Root Registry
on:
  push:
    branches: [main]
    paths:
      - 'experiments/lorentzian_eprl_two_vertex_root_registry.py'
      - '.github/workflows/isqgr-lorentzian-eprl-two-vertex-root-registry.yml'
  workflow_dispatch:
permissions: {contents: read}
env:
  ARXIV_ID: '1801.03771'
jobs:
  registry:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Fetch pinned source
        run: |
          set -euo pipefail
          mkdir -p external/two_vertex_src
          (curl -fL --retry 3 --retry-delay 2 https://export.arxiv.org/e-print/${ARXIV_ID} -o /tmp/src.tar || curl -fL --retry 3 --retry-delay 2 https://arxiv.org/e-print/${ARXIV_ID} -o /tmp/src.tar)
          tar -xf /tmp/src.tar -C external/two_vertex_src
      - name: Build paper-root registry
        run: |
          mkdir -p compute_out
          python experiments/lorentzian_eprl_two_vertex_root_registry.py --source-dir external/two_vertex_src --output compute_out/root_registry.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: two-vertex-root-registry
          path: compute_out/*.json
          if-no-files-found: error
