name: ITER177 RC008 heldout nonretuned transport

on:
  push:
    paths: ['.github/workflows/iter177-rc008-heldout-nonretuned-transport.yml']
  workflow_dispatch:
permissions: {contents: read}

jobs:
  calibration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check numpy scipy
      - run: python code/iter062b/reconstruct.py --mode calibration --out out/calibration.json
      - uses: actions/upload-artifact@v4
        with: {name: iter177-calibration, path: out/calibration.json}
  boundary:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix: {boundary: [P1,P2,H1,H2,H3,H4]}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check numpy scipy
      - name: Apply only preregistered ITER063 boundary/seed overrides
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('code/iter062b/reconstruct.py'); s=p.read_text()
          a=s.index('SEEDS='); b=s.index('\nPOWERS=',a)
          s=s[:a]+'SEEDS=[32452843,49979687,67867967]'+s[b:]
          a=s.index('BOUNDARIES={'); b=s.index('\n}\n',a)+3
          repl="BOUNDARIES={\n 'P1':(1.,3.,1.,1.), 'P2':(1.,1.,3.,1.),\n 'H1':(2.,1.,1.,2.), 'H2':(2.,3.,1.,1.), 'H3':(2.,3.,4.,1.), 'H4':(1.,2.,3.,2.),\n}\n"
          p.write_text(s[:a]+repl+s[b:])
          PY
      - run: python code/iter062b/reconstruct.py --mode boundary --boundary '${{ matrix.boundary }}' --out 'out/${{ matrix.boundary }}.json'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iter177-${{ matrix.boundary }}
          path: out/${{ matrix.boundary }}.json
          if-no-files-found: error
  aggregate:
    needs: [calibration,boundary]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: {pattern: 'iter177-*', path: artifacts, merge-multiple: true}
      - name: Apply frozen ITER063 predicates
        run: |
          python - <<'PY'
          import glob,json,math,statistics,os
          A=[.45,.50,.55,.60,.65,.70,.75,.80]; C={.55,.60,.65,.70}; names=['P1','P2','H1','H2','H3','H4']
          def load(n):
            p=glob.glob('artifacts/'+n+'.json'); return json.load(open(p[0])) if p else None
          cal=load('calibration'); ds={n:load(n) for n in names}; missing=[n for n,v in ds.items() if v is None]
          S={}
          for n,d in ds.items():
            if d is None: continue
            def maps(power,kind):
              val={a:[] for a in A}; ess={a:[] for a in A}; fin={a:[] for a in A}
              for row in d['rows']:
                if row['power']!=power: continue
                for r in row[kind]:
                  a=round(float(r['alpha']),2); val[a].append(r['value']); ess[a].append(r['ess_fraction']); fin[a].append(r['finite_fraction'])
              return val,ess,fin
            c16,ce,cf=maps(16,'coarse'); f16,fe,ff=maps(16,'fine'); c14,_,_=maps(14,'coarse'); f14,_,_=maps(14,'fine')
            checks=[]; D={}
            for a in A:
              cv=lambda x: statistics.stdev(x)/max(abs(statistics.mean(x)),1e-300)
              rel=lambda x,y: abs(x-y)/max(abs(y),1e-300)
              cm,fm=statistics.mean(c16[a]),statistics.mean(f16[a]); z=[f16[a][i]-c16[a][i] for i in range(3)]
              D[a]=(statistics.mean(z),statistics.stdev(z)/math.sqrt(3))
              if a in C: checks += [all(x==1.0 for x in cf[a]+ff[a]),statistics.median(ce[a])>=1e-4,statistics.median(fe[a])>=1e-4,cv(c16[a])<=.15,cv(f16[a])<=.15,rel(statistics.mean(c14[a]),cm)<=.20,rel(statistics.mean(f14[a]),fm)<=.20]
            crossings=[]
            for a,b in zip(A[:-1],A[1:]):
              x,y=D[a],D[b]
              if x[0]*y[0]<0 and abs(x[0])>x[1] and abs(y[0])>y[1]: crossings.append([a,b])
            S[n]={'converged':all(checks),'robust_crossing':bool(crossings),'crossings':crossings}
          if missing or cal is None: cls='INFRASTRUCTURE_FAIL_PRE_SCIENCE'
          elif not cal.get('pass',False): cls='INVALID_IMPLEMENTATION_CALIBRATION'
          elif not all(S[p]['converged'] and S[p]['robust_crossing'] and any((x[1]>=.50 and x[0]<=.60) for x in S[p]['crossings']) for p in ['P1','P2']): cls='INVALID_IMPLEMENTATION_OR_SELECTOR_SYMMETRY_FAIL'
          else:
            conv=[h for h in ['H1','H2','H3','H4'] if S[h]['converged']]; cross=[h for h in conv if S[h]['robust_crossing']]
            cls='SCIENTIFIC_PASS_RC008_HELDOUT_TRANSPORT_SCOPED' if len(conv)>=3 and len(cross)>=2 else ('SCIENTIFIC_FAIL_RC008_HELDOUT_TRANSPORT_NOT_ROBUST' if len(conv)>=3 else 'NUMERICAL_FAIL_HELDOUT_PANEL_CONVERGENCE_NOT_ESTABLISHED')
          out={'classification':cls,'calibration_pass':bool(cal and cal.get('pass',False)),'missing':missing,'boundaries':S,'claim_locks':{'bridge_credit':False,'candidate_theory':'UNFORMED','full_eprl_refinement':False,'lorentzian_refinement':False,'new_physics':False}}
          os.makedirs('aggregate',exist_ok=True); open('aggregate/summary.json','w').write(json.dumps(out,indent=2,sort_keys=True)+'\n'); print(json.dumps(out,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with: {name: iter177-aggregate, path: aggregate/summary.json}
