name: ITER066 BH004 causal-set amplitude refinement source authority

on:
  push:
    paths:
      - '.github/workflows/iter066_bh004_causal_set_source_authority.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        source: ['1903.11544','2007.13192','gr-qc/0212064']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check requests pypdf
      - name: Frozen exact-PDF source audit
        run: python code/iter066/source_gate.py --source '${{ matrix.source }}' --out 'out/${{ matrix.source }}.json'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iter066-${{ matrix.source }}
          path: out/${{ matrix.source }}.json
          if-no-files-found: warn

  aggregate:
    needs: [source]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: iter066-*
          path: artifacts
          merge-multiple: true
      - name: Frozen aggregate source classifier
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          rows=[json.loads(p.read_text()) for p in sorted(Path('artifacts').glob('*.json'))]
          frozen={'1903.11544','2007.13192','gr-qc/0212064'}
          ids={r.get('source') for r in rows}
          infra=ids!=frozen or any(r.get('classification')=='INFRASTRUCTURE_FAIL_SOURCE_EXTRACTION' for r in rows)
          joint=sorted(r['source'] for r in rows if r.get('classification')=='SOURCE_CANDIDATE_AMPLITUDE_REFINEMENT_PRESENT')
          qonly=sorted(r['source'] for r in rows if r.get('classification')=='SOURCE_CANDIDATE_QUANTUM_DYNAMICS_ONLY')
          if infra: c='INFRASTRUCTURE_FAIL_SOURCE_EXTRACTION'
          elif joint: c='SOURCE_CANDIDATE_AMPLITUDE_REFINEMENT_PRESENT_REQUIRES_MANUAL_AUDIT'
          elif qonly: c='SOURCE_CANDIDATE_QUANTUM_DYNAMICS_ONLY_REQUIRES_MANUAL_AUDIT'
          else: c='SCOPED_BLOCKED_NO_SOURCE_FAITHFUL_AMPLITUDE_REFINEMENT_OBJECT'
          out={'iteration':'ITER066','classification':c,'joint_candidate_sources':joint,'quantum_only_sources':qonly,'gate_credit':False,'bridge_credit':False,'claim_lock':'manual equation-level source audit required before any BH004 amplitude/refinement computation'}
          Path('aggregate').mkdir(exist_ok=True); Path('aggregate/summary.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n'); print(json.dumps(out,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: iter066-aggregate
          path: aggregate/summary.json
          if-no-files-found: error
