name: ITER069 RC003 FRG scale composition authority
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/iter069_rc003_frg_authority.yml'
  workflow_dispatch:

jobs:
  source:
    strategy:
      fail-fast: false
      matrix:
        source: ['2302.14152','2606.21522','2110.09566']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests pypdf
      - name: Frozen exact-PDF source extraction
        shell: python
        env:
          SOURCE: ${{ matrix.source }}
        run: |
          import io,json,os,re,time,pathlib,requests
          from pypdf import PdfReader
          aid=os.environ['SOURCE']; terms=['effective average action','wetterich','functional renormalization group','regulator','cutoff','background field','gauge fixing','flow equation','fixed point','theory space','trajectory','coarse graining','coarse-graining','semigroup','composition']
          data=None; errors=[]
          for u in [f'https://arxiv.org/pdf/{aid}',f'https://export.arxiv.org/pdf/{aid}']:
            for k in range(3):
              try:
                r=requests.get(u,timeout=45,headers={'User-Agent':'ISQGR-ITER069/1.0'})
                if r.status_code==200 and r.content[:4]==b'%PDF': data=r.content; break
                errors.append(f'{u}:HTTP{r.status_code}')
              except Exception as e: errors.append(f'{u}:{type(e).__name__}:{e}')
              time.sleep(2*(k+1))
            if data is not None: break
          if data is None: out={'source':aid,'classification':'INFRASTRUCTURE_FAIL_SOURCE_EXTRACTION','errors':errors}
          else:
            rd=PdfReader(io.BytesIO(data)); text='\n'.join((p.extract_text() or '') for p in rd.pages); low=text.lower(); rows=[]
            for t in terms:
              for m in re.finditer(re.escape(t),low):
                lo=max(0,m.start()-900); hi=min(len(text),m.end()+900); sn=re.sub(r'\s+',' ',text[lo:hi]); rows.append({'trigger':t,'snippet':sn[:2200]})
            out={'source':aid,'classification':'SOURCE_CANDIDATE_REQUIRES_MANUAL_EQUATION_AUDIT','pages':len(rd.pages),'pdf_bytes':len(data),'passages':rows[:150],'claim_lock':'green CI is not scientific PASS'}
          pathlib.Path('out').mkdir(); pathlib.Path(f'out/{aid}.json').write_text(json.dumps(out,indent=2)+'\n')
      - uses: actions/upload-artifact@v4
        with:
          name: iter069-${{ matrix.source }}
          path: out/${{ matrix.source }}.json
          if-no-files-found: error
  aggregate:
    needs: source
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: iter069-*
          path: inputs
          merge-multiple: true
      - shell: python
        run: |
          import glob,json,pathlib
          rows=[json.load(open(p)) for p in glob.glob('inputs/*.json')]
          infra=[r.get('source') for r in rows if r.get('classification')=='INFRASTRUCTURE_FAIL_SOURCE_EXTRACTION']
          out={'iteration':'ITER069','classification':'INFRASTRUCTURE_FAIL_SOURCE_EXTRACTION' if infra else 'SOURCE_CANDIDATES_REQUIRE_MANUAL_EQUATION_AUDIT','sources':[r.get('source') for r in rows],'infrastructure_fail_sources':infra,'gate_credit':False,'bridge_credit':False,'claim_lock':'manual equation-level audit against prereg required'}
          pathlib.Path('out').mkdir(); pathlib.Path('out/summary.json').write_text(json.dumps(out,indent=2)+'\n')
      - uses: actions/upload-artifact@v4
        with:
          name: iter069-aggregate
          path: out/summary.json
