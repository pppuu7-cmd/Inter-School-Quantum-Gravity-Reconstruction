name: ISQGR Iter020 held-out q-CG transport

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/isqgr-iter020-heldout-transport.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: heldout (${{ matrix.lane }})
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        lane: [level-transport, near-cutoff, heldout-recoupling, null-calibration]
    steps:
      - uses: actions/checkout@v4
      - name: Pin numerical runtime
        run: |
          python -m pip install --disable-pip-version-check 'numpy==2.3.3' 'mpmath==1.3.0'
          python - <<'PY'
          import json, platform, numpy, mpmath, pathlib
          pathlib.Path('runtime.json').write_text(json.dumps({
            'python': platform.python_version(),
            'numpy': numpy.__version__,
            'mpmath': mpmath.__version__
          }, indent=2) + '\n')
          PY
      - name: Run frozen ITER020 lane
        run: |
          rm -rf out
          python code/iter020/qcg_heldout_transport.py --lane '${{ matrix.lane }}'
          cp runtime.json out/runtime.json
          sha256sum code/iter020/qcg_heldout_transport.py > out/CODE_SHA256.txt
          sha256sum code/iter019/qcg_solver_validation.py > out/ITER019_BACKEND_SHA256.txt
          cat out/evidence.json
      - name: Upload lane evidence
        uses: actions/upload-artifact@v4
        with:
          name: iter020-${{ matrix.lane }}
          path: out/
          if-no-files-found: error
          compression-level: 6

  aggregate:
    name: aggregate scientific classification
    if: always()
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: iter020-*
          path: lanes
      - name: Frozen aggregate
        run: |
          python - <<'PY'
          import json, pathlib
          expected=['level-transport','near-cutoff','heldout-recoupling','null-calibration']
          rows=[]
          for p in sorted(pathlib.Path('lanes').glob('*/evidence.json')):
              try:
                  rows.append(json.loads(p.read_text()))
              except Exception as e:
                  rows.append({'lane':str(p.parent),'aggregate_read_error':repr(e)})
          by={r.get('lane'):r for r in rows}
          infra=(len(rows)!=4 or any(r.get('infrastructure_failure') or r.get('aggregate_read_error') for r in rows))
          passed={k:(by.get(k,{}).get('pass') is True) for k in expected}
          if infra:
              cls='RC006_QCG_HELDOUT_INFRASTRUCTURE_PARTIAL'
          elif not passed['level-transport']:
              cls='RC006_QCG_LEVEL_TRANSPORT_FAIL'
          elif not passed['near-cutoff']:
              cls='RC006_QCG_NEAR_CUTOFF_FAIL'
          elif not passed['heldout-recoupling']:
              cls='RC006_QCG_HELDOUT_RECOUPLING_FAIL'
          elif not passed['null-calibration']:
              cls='RC006_QCG_NULL_CALIBRATION_FAIL'
          else:
              cls='RC006_QCG_HELDOUT_TRANSPORT_PASS'
          full=(cls=='RC006_QCG_HELDOUT_TRANSPORT_PASS')
          out={
            'classification':cls,
            'lane_pass':passed,
            'lanes':rows,
            'eq27_component_reconstruction_prereg_allowed':full,
            'implementation_validation_gate_authorized':True,
            'iter012_retry_authorized':False,
            'eq29_amplitude_authorized':False,
            'bridge_credit':False,
            'candidate_theory_authorized':False,
            'preferred_alpha_found':False,
            'new_physics_found':False
          }
          pathlib.Path('aggregate.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(json.dumps(out,indent=2,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: iter020-aggregate
          path: aggregate.json
          if-no-files-found: error

# ITER020 workflow aligned exactly to the current frozen prereg and worker lanes.
