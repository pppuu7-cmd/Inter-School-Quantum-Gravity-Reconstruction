name: ISQGR Iter006 RC006 Eq29 Source Dependencies

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/isqgr_iter006_rc006_eq29_source_dependencies.yml'
      - 'status/ITERATION_006_RC006_EQ29_GEOMETRY_INCIDENCE_RPLACEMENT.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    strategy:
      fail-fast: false
      matrix:
        mode: [geometry, incidence, rplacement]
    runs-on: ubuntu-24.04
    steps:
      - name: Fetch pinned source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p src out
          curl -fL --retry 3 --retry-delay 2 https://export.arxiv.org/e-print/1609.02429v2 -o source.bundle || curl -fL --retry 3 --retry-delay 2 https://arxiv.org/e-print/1609.02429v2 -o source.bundle
          echo '3e04a41195e0313fd97c68fcb8cc2ec30fa4bdfb5529ba867923c4120fc3e0ee  source.bundle' | sha256sum -c -
          tar -xf source.bundle -C src
          test -s src/bc-spin-nets.tex

      - name: Run frozen source dependency audit
        env:
          MODE: ${{ matrix.mode }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os,pathlib,re
          mode=os.environ['MODE']
          raw=pathlib.Path('src/bc-spin-nets.tex').read_text()

          # Frozen TeX comment semantics: strip first unescaped percent to EOL.
          active_lines=[]
          for line in raw.splitlines(True):
              cut=None
              for i,ch in enumerate(line):
                  if ch!='%': continue
                  bs=0; j=i-1
                  while j>=0 and line[j]=='\\': bs+=1; j-=1
                  if bs%2==0: cut=i; break
              active_lines.append(line if cut is None else line[:cut]+('\n' if line.endswith('\n') else ''))
          active=''.join(active_lines)

          sub_rx=re.compile(r'\\subsection\s*\{EPRL intertwiner model\}')
          subs=list(sub_rx.finditer(active))
          if len(subs)!=1:
              out={'mode':mode,'valid':False,'classification':'INVALID_SOURCE_OR_IMPLEMENTATION','reason':'eprl_subsection_count_not_one','count':len(subs)}
              pathlib.Path(f'out/{mode}.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n'); print(json.dumps(out,indent=2)); raise SystemExit(2)
          s=subs[0]
          boundary=re.compile(r'\\(?:subsection|section)\s*\{').search(active,s.end())
          end=boundary.start() if boundary else len(active)
          body=active[s.start():end]
          target_rx=re.compile(r'[^\n]*initial\s+3-valent\s+tensor[^\n]*\\eqref\{eq:eprl-3-valent\}[^\n]*',re.I)
          targets=list(target_rx.finditer(body))
          if len(targets)!=1:
              out={'mode':mode,'valid':False,'classification':'INVALID_SOURCE_OR_IMPLEMENTATION','reason':'target_anchor_count_not_one','count':len(targets)}
              pathlib.Path(f'out/{mode}.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n'); print(json.dumps(out,indent=2)); raise SystemExit(2)
          t=targets[0]
          after=body[t.end():]
          bm=re.search(r'\\begin\{(align\*?)\}',after)
          if not bm: raise SystemExit('no following align')
          env=bm.group(1); rel_b=t.end()+bm.start(); token='\\end{'+env+'}'; rel_e=body.find(token,rel_b)
          if rel_e<0: raise SystemExit('unclosed align')
          rel_e += len(token)
          block=body[rel_b:rel_e]
          block_sha=hashlib.sha256(block.encode()).hexdigest()
          expected='4f505657a580216d176c1c63ec92f5614dc73e8113294722a854d5a350b67083'
          if block_sha!=expected:
              out={'mode':mode,'valid':False,'classification':'INVALID_SOURCE_OR_IMPLEMENTATION','reason':'candidate_block_hash_mismatch','observed':block_sha,'expected':expected}
              pathlib.Path(f'out/{mode}.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n'); print(json.dumps(out,indent=2)); raise SystemExit(2)

          tikz=re.findall(r'\\begin\{tikzpicture\}.*?\\end\{tikzpicture\}',block,re.S)
          draws=re.findall(r'\\draw\b.*?;',block,re.S)
          labels=[]
          for d in draws:
              labels += re.findall(r'node\s*(?:\[[^\]]*\])?\s*\{([^{}]*(?:\{[^{}]*\}[^{}]*)*)\}',d,re.S)
          norm=lambda x: re.sub(r'[\s${}\\]','',x)
          nlabels=[norm(x) for x in labels]

          if mode=='geometry':
              required=[norm(x) for x in ['J^-','J^+','l','j^-_1','j^+_1','j^-_2','j^+_2','l_1','l_2']]
              missing=[x for x in required if x not in nlabels]
              passed=bool(tikz and draws and not missing)
              out={'mode':mode,'valid':True,'candidate_block_sha256':block_sha,'tikz_picture_count':len(tikz),'draw_command_count':len(draws),'node_labels':labels,'normalized_labels':nlabels,'required_normalized_labels':required,'missing':missing,'scientific_pass':passed,'classification':'SOURCE_LABEL_GEOMETRY_QUALIFIED' if passed else 'SOURCE_LABEL_GEOMETRY_NOT_QUALIFIED'}

          elif mode=='incidence':
              # Source-level only: tokenize explicit coordinate/node/path operators; never infer by raster proximity.
              path_records=[]
              label_assoc=set()
              for di,d in enumerate(draws):
                  coords=re.findall(r'\(([^()]*)\)',d)
                  ops=re.findall(r'(--|to\b|edge\b|arc\b|plot\b)',d)
                  dlabs=re.findall(r'node\s*(?:\[[^\]]*\])?\s*\{([^{}]*(?:\{[^{}]*\}[^{}]*)*)\}',d,re.S)
                  label_assoc.update(norm(x) for x in dlabs)
                  path_records.append({'draw_index':di,'coordinate_tokens':coords,'path_operators':ops,'labels':dlabs,'raw':d})
              required=[norm(x) for x in ['J^-','J^+','l','j^-_1','j^+_1','j^-_2','j^+_2','l_1','l_2']]
              missing_assoc=[x for x in required if x not in label_assoc]
              finite_nonempty=bool(path_records and any(r['coordinate_tokens'] or r['path_operators'] for r in path_records))
              passed=finite_nonempty and not missing_assoc
              out={'mode':mode,'valid':True,'candidate_block_sha256':block_sha,'path_record_count':len(path_records),'path_records':path_records,'required_normalized_labels':required,'missing_label_path_associations':missing_assoc,'scientific_pass':passed,'classification':'SOURCE_PATH_INCIDENCE_QUALIFIED' if passed else 'SOURCE_PATH_INCIDENCE_NOT_MACHINE_QUALIFIED'}

          else:
              # Frozen scope: EPRL subsection plus source preceding it. Generic definitions count only if Eq29 context deterministically links them.
              prefix=active[:s.start()]
              # Collect explicit source occurrences, retaining offsets and short contexts.
              patR=re.compile(r'(?:\\mathcal\s*\{?R\}?|R[- ]?matrix|R\\-matrix|R\^\{-1\}|R\^{-1})',re.I)
              cross=re.compile(r'(overcross|undercross|over-cross|under-cross|crossing)',re.I)
              def occ(text,rx):
                  z=[]
                  for m in rx.finditer(text):
                      z.append({'offset':m.start(),'match':m.group(0),'context':text[max(0,m.start()-180):min(len(text),m.end()+220)].replace('\n',' ')})
                  return z
              r_prefix=occ(prefix,patR); r_body=occ(body,patR); c_prefix=occ(prefix,cross); c_body=occ(body,cross)
              # Deterministic Eq29 link requires an R/crossing token in the EPRL subsection itself; source-global definitions alone are insufficient.
              body_link=bool(r_body or c_body)
              has_r=bool(r_prefix or r_body)
              # inverse semantics, conservatively search textual inverse or superscript -1 in active source before/end of EPRL subsection.
              inv_rx=re.compile(r'(inverse[^\n]{0,120}R|R[^\n]{0,40}inverse|R\s*\^\s*\{?-1\}?|\\mathcal\s*\{?R\}?\s*\^\s*\{?-1\}?)',re.I)
              inv=occ(active[:end],inv_rx)
              has_cross=bool(c_prefix or c_body)
              passed=has_r and bool(inv) and has_cross and body_link
              out={'mode':mode,'valid':True,'candidate_block_sha256':block_sha,'r_occurrences_prefix':r_prefix[-12:],'r_occurrences_eprl':r_body,'crossing_occurrences_prefix':c_prefix[-12:],'crossing_occurrences_eprl':c_body,'inverse_occurrences':inv[-12:],'has_r_definition_or_symbol':has_r,'has_inverse_semantics':bool(inv),'has_crossing_semantics':has_cross,'deterministic_eprl_eq29_link':body_link,'scientific_pass':passed,'classification':'SOURCE_R_PLACEMENT_QUALIFIED' if passed else 'SOURCE_R_PLACEMENT_NOT_MACHINE_QUALIFIED'}

          pathlib.Path(f'out/{mode}.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(json.dumps(out,indent=2,sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: eq29-source-dependency-${{ matrix.mode }}
          path: out/${{ matrix.mode }}.json
          if-no-files-found: error

  aggregate:
    needs: audit
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: eq29-source-dependency-*
          path: inputs
          merge-multiple: true
      - name: Apply frozen aggregate classifier
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          python - <<'PY'
          import json,pathlib
          modes=['geometry','incidence','rplacement']
          rows={}
          for m in modes:
              p=pathlib.Path('inputs')/f'{m}.json'
              if not p.exists():
                  out={'valid':False,'classification':'INVALID_SOURCE_OR_IMPLEMENTATION','reason':f'missing_{m}_artifact'}
                  pathlib.Path('out/summary.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n'); print(json.dumps(out,indent=2)); raise SystemExit(2)
              rows[m]=json.loads(p.read_text())
          if not all(r.get('valid') is True for r in rows.values()):
              classification='INVALID_SOURCE_OR_IMPLEMENTATION'; valid=False
          else:
              valid=True; n=sum(bool(r.get('scientific_pass')) for r in rows.values())
              classification='EQ29_SOURCE_DEPENDENCIES_COMPLETE' if n==3 else ('EQ29_SOURCE_DEPENDENCIES_PARTIAL' if n>0 else 'EQ29_SOURCE_DEPENDENCIES_BLOCKED')
          out={'gate':'ITER006_RC006_EQ29_GEOMETRY_INCIDENCE_RPLACEMENT','valid':valid,'lane_classifications':{m:rows[m].get('classification') for m in modes},'lane_pass':{m:bool(rows[m].get('scientific_pass')) for m in modes},'classification':classification,'eq29_amplitude_authorized': classification=='EQ29_SOURCE_DEPENDENCIES_COMPLETE','bridge_credit':False,'claim_lock':'Even COMPLETE authorizes only a separately preregistered literal Eq29 tensor reconstruction gate.'}
          pathlib.Path('out/summary.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(json.dumps(out,indent=2,sort_keys=True))
          if not valid: raise SystemExit(2)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: eq29-source-dependencies-summary
          path: out/summary.json
          if-no-files-found: error
