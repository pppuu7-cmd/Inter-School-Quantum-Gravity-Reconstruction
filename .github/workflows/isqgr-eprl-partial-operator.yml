name: ISQGR Lorentzian EPRL Partial Operator

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/isqgr-eprl-partial-operator.yml'
      - 'experiments/eprl_partial_operator_benchmark.jl'

permissions:
  contents: read

jobs:
  eprl-operator:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        gamma: ['0.5','1.2']
        Dl: ['0','1']
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.11'
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential gcc-12 g++-12 m4 lzip wget ca-certificates \
            libgmp-dev libmpfr-dev libmpc-dev libgsl-dev \
            libopenblas-dev libblas-dev libomp-dev
      - name: Install Julia dependencies
        run: julia -e 'using Pkg; Pkg.add(["HalfIntegers","JSON3"]); Pkg.precompile()'
      - name: Checkout pinned sl2cfoam-next
        run: |
          git clone https://github.com/qg-cpt-marseille/sl2cfoam-next.git external/sl2cfoam-next
          git -C external/sl2cfoam-next checkout 052e4346028870bd76f69a3034e6cae8defb8f7f
      - name: Build Wigner dependencies with GCC 12
        working-directory: external/sl2cfoam-next
        run: |
          mkdir -p ext
          cd ext
          wget -q https://fy.chalmers.se/subatom/wigxjpf/wigxjpf-1.13.tar.gz -O wigxjpf.tar.gz
          tar -xzf wigxjpf.tar.gz
          mv wigxjpf-1.13 wigxjpf
          make -C wigxjpf CC=gcc-12 -j2
          wget -q https://fy.chalmers.se/subatom/fastwigxj/fastwigxj-1.4.1.tar.gz -O fastwigxj.tar.gz
          tar -xzf fastwigxj.tar.gz
          mv fastwigxj-1.4.1 fastwigxj
          make -C fastwigxj CC=gcc-12 CXX=g++-12 -j2
      - name: Precompute Wigner tables
        working-directory: external/sl2cfoam-next
        run: |
          mkdir -p data_sl2cfoam
          ./ext/fastwigxj/bin/hash_js --max-E-3j=20 /dev/null ./data_sl2cfoam/table_20.3j
          ./ext/fastwigxj/bin/hash_js --max-E-6j=20 /dev/null ./data_sl2cfoam/table_20.6j
      - name: Build sl2cfoam library sequentially
        working-directory: external/sl2cfoam-next
        run: |
          make CC=gcc-12 BLAS=system OMP=0 lib -j2
          test -f lib/libsl2cfoam.so
      - name: Run source-native EPRL partial-operator benchmark
        env:
          SL2CFOAM_ROOT: external/sl2cfoam-next
          LD_LIBRARY_PATH: ${{ github.workspace }}/external/sl2cfoam-next/lib
        run: |
          julia experiments/eprl_partial_operator_benchmark.jl \
            ${{ matrix.gamma }} ${{ matrix.Dl }} 20260916 256 \
            "compute_out/eprl_partial_gamma${{ matrix.gamma }}_Dl${{ matrix.Dl }}.json"
      - uses: actions/upload-artifact@v4
        with:
          name: eprl-partial-gamma${{ matrix.gamma }}-Dl${{ matrix.Dl }}
          path: compute_out/*.json
          if-no-files-found: error

  aggregate:
    if: always()
    needs: [eprl-operator]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: eprl-partial-*
          path: campaign
          merge-multiple: true
      - name: Aggregate robust EPRL diagnostics
        run: |
          python - <<'PY'
          import json,pathlib,statistics
          rows=[]
          for p in pathlib.Path('campaign').glob('*.json'):
              x=json.loads(p.read_text()); s=x['summary']
              rows.append({
                'gamma':x['gamma'],'Dl':x['Dl'],
                'train_rank':x['train_numerical_rank'],
                'train_singular_values':x['train_singular_values'],
                'mean_fraction_random_worse_return':s['mean_fraction_random_worse_return'],
                'mean_fraction_random_worse_leakage':s['mean_fraction_random_worse_leakage'],
                'mean_relative_operator_difference':s['mean_relative_operator_difference'],
              })
          if len(rows) != 4:
              raise SystemExit(f'expected four EPRL jobs, found {len(rows)}')
          out={
            'test':'LORENTZIAN_EPRL_PARTIAL_OPERATOR_CAMPAIGN_SUMMARY',
            'n_jobs':len(rows),
            'rows':sorted(rows,key=lambda r:(r['gamma'],r['Dl'])),
            'overall':{
              'mean_fraction_random_worse_return':statistics.fmean(r['mean_fraction_random_worse_return'] for r in rows),
              'mean_fraction_random_worse_leakage':statistics.fmean(r['mean_fraction_random_worse_leakage'] for r in rows),
              'mean_relative_operator_difference':statistics.fmean(r['mean_relative_operator_difference'] for r in rows),
            },
            'claim_lock':'Source-native Lorentzian EPRL partial operators from coherent boundary contractions. SVD train sector and tentative equal-spin composition only; not yet a physical coarse-graining prescription.'
          }
          pathlib.Path('eprl_partial_operator_summary.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(json.dumps(out,indent=2,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: isqgr-eprl-partial-operator-summary
          path: eprl_partial_operator_summary.json
          if-no-files-found: error
