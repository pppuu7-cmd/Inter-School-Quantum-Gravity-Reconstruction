name: ITER082 CDT spatial Laplacian FRG mode-scale authority
# frozen prereg: 457ec94f4afab5c28c01851a8dbfd06ff6be91ad
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/iter082_cdt_spatial_laplacian_frg_mode_scale_authority.yml'
  workflow_dispatch:

jobs:
  source:
    strategy:
      fail-fast: false
      matrix:
        source: ['1903.00430','1912.11311','2203.08003','2306.10408','2402.01260']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests pypdf
      - name: Frozen exact-PDF spatial-mode extraction
        shell: python
        env:
          SOURCE: ${{ matrix.source }}
        run: |
          import io,json,os,re,time,pathlib,requests,hashlib
          from pypdf import PdfReader
          aid=os.environ['SOURCE']
          terms=['laplace-beltrami','laplacian','spectral gap','eigenvalue','spatial slice','spatial metric','foliation','adm','cutoff mode','cutoff modes','regulator','coarse graining','coarse-graining','k^2','momentum scale','background laplacian','d\'alembertian','lapse','shift vector','anisotropy','proper time']
          data=None; errors=[]; used=None
          for u in [f'https://arxiv.org/pdf/{aid}',f'https://export.arxiv.org/pdf/{aid}']:
            for k in range(3):
              try:
                r=requests.get(u,timeout=45,headers={'User-Agent':'ISQGR-ITER082/1.0'})
                if r.status_code==200 and r.content[:4]==b'%PDF': data=r.content; used=u; break
                errors.append(f'{u}:HTTP{r.status_code}')
              except Exception as e: errors.append(f'{u}:{type(e).__name__}:{e}')
              time.sleep(2*(k+1))
            if data is not None: break
          if data is None:
            out={'source':aid,'classification':'INFRASTRUCTURE_FAIL_SOURCE_EXTRACTION','errors':errors,'gate_credit':False,'bridge_credit':False}
          else:
            rd=PdfReader(io.BytesIO(data)); text='\n'.join((p.extract_text() or '') for p in rd.pages); low=text.lower(); rows=[]
            for t in terms:
              for m in re.finditer(re.escape(t),low):
                lo=max(0,m.start()-1400); hi=min(len(text),m.end()+1400)
                rows.append({'trigger':t,'snippet':re.sub(r'\s+',' ',text[lo:hi])[:3200]})
            out={'source':aid,'classification':'SOURCE_CANDIDATE_REQUIRES_MANUAL_EQUATION_AUDIT','pages':len(rd.pages),'pdf_bytes':len(data),'pdf_sha256':hashlib.sha256(data).hexdigest(),'retrieved_from':used,'passages':rows[:260],'gate_credit':False,'bridge_credit':False,'claim_lock':'3D CDT slice cannot be identified with FRG mode scale by dimensional analogy; manual typed map audit required'}
          pathlib.Path('out').mkdir(); pathlib.Path(f'out/{aid}.json').write_text(json.dumps(out,indent=2)+'\n')
      - uses: actions/upload-artifact@v4
        with:
          name: iter082-${{ matrix.source }}
          path: out/${{ matrix.source }}.json
          if-no-files-found: error
  aggregate:
    needs: source
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: iter082-*
          path: inputs
          merge-multiple: true
      - shell: python
        run: |
          import glob,json,pathlib
          rows=[json.load(open(p)) for p in glob.glob('inputs/*.json')]
          expected=['1903.00430','1912.11311','2203.08003','2306.10408','2402.01260']
          got=[r.get('source') for r in rows]
          infra=[r.get('source') for r in rows if r.get('classification')=='INFRASTRUCTURE_FAIL_SOURCE_EXTRACTION']
          missing=[x for x in expected if x not in got]
          cls='INFRASTRUCTURE_FAIL_SOURCE_EXTRACTION' if infra or missing else 'SOURCE_CANDIDATES_REQUIRE_MANUAL_EQUATION_AUDIT'
          out={'iteration':'ITER082','classification':cls,'expected_sources':expected,'sources':got,'infrastructure_fail_sources':infra,'missing_sources':missing,'gate_credit':False,'bridge_credit':False,'claim_lock':'manual 3D-slice to FRG operator/normalization/mode-scale audit required'}
          pathlib.Path('out').mkdir(); pathlib.Path('out/summary.json').write_text(json.dumps(out,indent=2)+'\n')
      - uses: actions/upload-artifact@v4
        with:
          name: iter082-aggregate
          path: out/summary.json
