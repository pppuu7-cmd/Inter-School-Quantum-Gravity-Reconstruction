name: ISQGR SU2BF Source-Native Smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/isqgr-su2bf-source-native-smoke.yml'
      - 'experiments/su2bf_partial_vertex_smoke.jl'

permissions:
  contents: read

jobs:
  source-native-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.11'
      - name: Install Julia dependencies
        run: >-
          julia -e 'using Pkg; Pkg.add(["HalfIntegers","WignerSymbols","Memoize","Combinatorics","JSON3"]); Pkg.precompile()'
      - name: Checkout pinned source realization
        run: |
          git clone https://github.com/sethkasante/su2bf-TNAlgo.git external/su2bf-TNAlgo
          git -C external/su2bf-TNAlgo checkout 2460cda77b8fe27a4106e98bf39a94fa9059bc92
      - name: Execute source-native partial coherent vertex
        env:
          SU2BF_ROOT: external/su2bf-TNAlgo
        run: julia experiments/su2bf_partial_vertex_smoke.jl
      - uses: actions/upload-artifact@v4
        with:
          name: su2bf-source-native-smoke
          path: compute_out/su2bf_partial_vertex_smoke.json
          if-no-files-found: error
