name: ISQGR CEMR Three-Channel Rescue

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/isqgr-three-channel-rescue.yml'
      - 'experiments/cemr_three_channel_rescue.py'

permissions:
  contents: read

jobs:
  rescue-matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        alignment: [0.0, 0.5, 0.9, 1.0]
        sigma_causal: [0.02, 0.05, 0.20]
        seed: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip numpy
      - name: Run three-channel rescue benchmark
        run: >-
          python experiments/cemr_three_channel_rescue.py
          --seed ${{ matrix.seed }}
          --overlap 0.99
          --alignment ${{ matrix.alignment }}
          --sigma-area 0.02
          --sigma-causal ${{ matrix.sigma_causal }}
          --output compute_out/rescue_a${{ matrix.alignment }}_sc${{ matrix.sigma_causal }}_s${{ matrix.seed }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: rescue-a${{ matrix.alignment }}-sc${{ matrix.sigma_causal }}-s${{ matrix.seed }}
          path: compute_out/*.json
          if-no-files-found: error

  aggregate:
    if: always()
    needs: [rescue-matrix]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: campaign
          merge-multiple: true
      - name: Aggregate rescue matrix
        run: |
          python - <<'PY'
          import json, pathlib, statistics
          rows=[json.loads(p.read_text()) for p in pathlib.Path('campaign').glob('*.json')]
          groups={}
          for a in sorted({r['alignment'] for r in rows}):
              for sc in sorted({r['sigma_causal'] for r in rows}):
                  g=[r for r in rows if r['alignment']==a and r['sigma_causal']==sc]
                  if not g: continue
                  groups[f'alignment={a}|sigma_causal={sc}']={
                    'n':len(g),
                    'mean_condition_improvement_factor':statistics.fmean(r['rescue']['condition_improvement_factor'] for r in g),
                    'mean_smallest_singular_value_gain':statistics.fmean(r['rescue']['smallest_singular_value_gain'] for r in g),
                    'mean_phi_variance_reduction_factor':statistics.fmean(r['rescue']['phi_variance_reduction_factor'] for r in g),
                    'mean_phi_rmse_improvement_factor':statistics.fmean(r['rescue']['phi_rmse_improvement_factor'] for r in g),
                    'mean_joint_condition_number':statistics.fmean(r['with_causal_channel']['condition_number'] for r in g),
                  }
          out={'test':'CEMR_THREE_CHANNEL_RESCUE_CAMPAIGN','groups':groups,'claim_lock':'Synthetic causal channel only.'}
          pathlib.Path('rescue_summary.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(json.dumps(out,indent=2,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: isqgr-three-channel-rescue-summary
          path: rescue_summary.json
          if-no-files-found: error
