name: ISQGR BH001-BH003 Spectral Closure Bridge

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/isqgr-bh001-bh003-spectral-closure.yml'
      - 'experiments/bh001_bh003_spectral_closure_bridge.py'
      - 'experiments/causal_set_ssee_2d_reproduction.py'

permissions:
  contents: read

jobs:
  closure-bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        n: [256, 512, 768, 1024]
        seed: [31, 32, 33, 34]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip numpy scipy
      - name: Compare spectral and random projector closure
        run: >-
          python experiments/bh001_bh003_spectral_closure_bridge.py
          --n ${{ matrix.n }}
          --seed ${{ matrix.seed }}
          --n-random 16
          --output compute_out/closure_n${{ matrix.n }}_s${{ matrix.seed }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: closure-n${{ matrix.n }}-s${{ matrix.seed }}
          path: compute_out/*.json
          if-no-files-found: error

  aggregate:
    if: always()
    needs: [closure-bridge]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: campaign
          merge-multiple: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Aggregate closure bridge statistics
        run: |
          python - <<'PY'
          import json,pathlib,statistics
          rows=[json.loads(p.read_text()) for p in pathlib.Path('campaign').glob('*.json')]
          groups=[]
          for n in sorted({r['n_parent'] for r in rows}):
              g=[r for r in rows if r['n_parent']==n]
              groups.append({
                  'n_parent':n,
                  'count':len(g),
                  'mean_retained_fraction':statistics.fmean(r['retained_fraction'] for r in g),
                  'mean_spectral_leakage':statistics.fmean(r['spectral']['leakage'] for r in g),
                  'mean_random_leakage':statistics.fmean(r['random']['mean_leakage'] for r in g),
                  'mean_spectral_seq_defect':statistics.fmean(r['spectral']['sequential_defect'] for r in g),
                  'mean_random_seq_defect':statistics.fmean(r['random']['mean_sequential_defect'] for r in g),
                  'mean_leakage_improvement_ratio':statistics.fmean(r['improvement_ratios']['random_mean_over_spectral_leakage'] for r in g),
                  'mean_seq_improvement_ratio':statistics.fmean(r['improvement_ratios']['random_mean_over_spectral_seq_defect'] for r in g),
                  'mean_leakage_percentile_better':statistics.fmean(r['random']['spectral_leakage_percentile_better'] for r in g),
                  'mean_seq_percentile_better':statistics.fmean(r['random']['spectral_seq_defect_percentile_better'] for r in g),
              })
          out={
              'test':'BH001_BH003_SPECTRAL_CLOSURE_BRIDGE_SUMMARY',
              'n_jobs':len(rows),
              'groups':groups,
              'overall':{
                  'mean_leakage_improvement_ratio':statistics.fmean(r['improvement_ratios']['random_mean_over_spectral_leakage'] for r in rows),
                  'mean_seq_improvement_ratio':statistics.fmean(r['improvement_ratios']['random_mean_over_spectral_seq_defect'] for r in rows),
                  'mean_leakage_percentile_better':statistics.fmean(r['random']['spectral_leakage_percentile_better'] for r in rows),
                  'mean_seq_percentile_better':statistics.fmean(r['random']['spectral_seq_defect_percentile_better'] for r in rows),
              },
              'claim_lock':'Tests whether the BH-003 spectral projector is unusually closed under G_R relative to rank-matched random projectors.'
          }
          pathlib.Path('spectral_closure_summary.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(json.dumps(out,indent=2,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: isqgr-bh001-bh003-spectral-closure-summary
          path: spectral_closure_summary.json
          if-no-files-found: error
