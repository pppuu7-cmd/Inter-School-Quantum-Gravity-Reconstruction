name: ISQGR RC-009 Dense Grid Reliability

on:
  push:
    branches: [main]
    paths:
      - 'experiments/rc009_dense_grid_reliability.py'
      - '.github/workflows/isqgr-rc009-dense-grid-reliability.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Evaluate independent coarse/fine midpoint grids
        run: |
          set -euo pipefail
          mkdir -p compute_out
          python experiments/rc009_dense_grid_reliability.py \
            --output compute_out/rc009_dense_grid_reliability.json
      - uses: actions/upload-artifact@v4
        with:
          name: isqgr-rc009-dense-grid-reliability
          path: compute_out/*.json
          if-no-files-found: error
