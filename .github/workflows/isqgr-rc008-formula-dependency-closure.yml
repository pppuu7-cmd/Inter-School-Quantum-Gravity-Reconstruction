name: ISQGR RC008 Formula Dependency Closure

on:
  push:
    branches: [main]
    paths:
      - 'experiments/rc008_formula_dependency_closure.py'
      - '.github/workflows/isqgr-rc008-formula-dependency-closure.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  closure:
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - role: amplitude
            arxiv: '1508.07961'
          - role: observable
            arxiv: '1508.07961'
          - role: embedding
            arxiv: '1701.02311'
          - role: matching
            arxiv: '1701.02311'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Fetch official arXiv source
        run: |
          set -euo pipefail
          mkdir -p external/arxiv_src
          (curl -fL --retry 3 --retry-delay 2 'https://export.arxiv.org/e-print/${{ matrix.arxiv }}' -o /tmp/src.tar || curl -fL --retry 3 --retry-delay 2 'https://arxiv.org/e-print/${{ matrix.arxiv }}' -o /tmp/src.tar)
          tar -xf /tmp/src.tar -C external/arxiv_src
      - name: Build labelled dependency closure
        run: |
          mkdir -p compute_out
          python experiments/rc008_formula_dependency_closure.py --source-dir external/arxiv_src --role '${{ matrix.role }}' --output 'compute_out/${{ matrix.role }}.json'
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: 'rc008-dependency-${{ matrix.role }}', path: 'compute_out/*.json', if-no-files-found: error}
  aggregate:
    needs: closure
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: {pattern: 'rc008-dependency-*', path: all, merge-multiple: true}
      - name: Apply frozen closure gate
        run: |
          python - <<'PY'
          import glob,json,pathlib,sys
          rows=[json.load(open(f)) for f in sorted(glob.glob('all/*.json'))]
          roles={r.get('role') for r in rows}; ok=(len(rows)==4 and roles=={'amplitude','observable','embedding','matching'} and all(r.get('frozen_gate_pass') for r in rows))
          out={'test':'RC008_FORMULA_DEPENDENCY_AGGREGATE','lane_count':len(rows),'roles':sorted(roles),'frozen_gate_pass':ok,'claim_lock':'Formula dependency closure only; executable amplitude/refinement gate remains open.'}
          pathlib.Path('summary.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n'); print(json.dumps(out,indent=2,sort_keys=True)); sys.exit(0 if ok else 2)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: rc008-formula-dependency-summary, path: summary.json, if-no-files-found: error}
