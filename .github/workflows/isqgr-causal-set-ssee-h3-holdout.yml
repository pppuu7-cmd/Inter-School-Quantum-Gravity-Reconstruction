name: ISQGR Causal-Set SSEE H3 Holdout

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/isqgr-causal-set-ssee-h3-holdout.yml'
      - 'experiments/causal_set_ssee_2d_reproduction.py'

permissions:
  contents: read

jobs:
  holdout-matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        side_ratio: [0.35, 0.50, 0.65]
        n: [256, 512, 768]
        seed: [7, 8, 9, 10]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip numpy scipy
      - name: Run frozen-rule H3 holdout
        run: >-
          python experiments/causal_set_ssee_2d_reproduction.py
          --n ${{ matrix.n }}
          --seed ${{ matrix.seed }}
          --side-ratio ${{ matrix.side_ratio }}
          --output compute_out/h3_r${{ matrix.side_ratio }}_n${{ matrix.n }}_s${{ matrix.seed }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: h3-r${{ matrix.side_ratio }}-n${{ matrix.n }}-s${{ matrix.seed }}
          path: compute_out/*.json
          if-no-files-found: error

  aggregate:
    if: always()
    needs: [holdout-matrix]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: campaign
          merge-multiple: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip numpy
      - name: Aggregate H3 transfer metrics
        run: |
          python - <<'PY'
          import json, pathlib, numpy as np
          rows=[json.loads(p.read_text()) for p in pathlib.Path('campaign').glob('*.json')]
          if not rows: raise SystemExit('no H3 artifacts')

          def fit(x,y):
              x=np.asarray(x,float); y=np.asarray(y,float)
              a,b=np.polyfit(x,y,1); pred=a*x+b
              den=np.sum((y-y.mean())**2)
              r2=1-np.sum((y-pred)**2)/den if den>0 else float('nan')
              return {'slope':float(a),'intercept':float(b),'r2':float(r2)}

          ratios={}
          for ratio in sorted({r['side_ratio'] for r in rows}):
              rr=[r for r in rows if r['side_ratio']==ratio]
              means=[]
              for n in sorted({r['n_parent'] for r in rr}):
                  g=[r for r in rr if r['n_parent']==n]
                  means.append({
                    'n_parent':n,
                    'mean_n_sub':float(np.mean([x['n_sub'] for x in g])),
                    'mean_raw_entropy':float(np.mean([x['raw_entropy'] for x in g])),
                    'mean_truncated_entropy':float(np.mean([x['truncated_entropy'] for x in g])),
                    'std_truncated_entropy':float(np.std([x['truncated_entropy'] for x in g],ddof=1)),
                    'count':len(g),
                  })
              raw_fit=fit([m['mean_n_sub'] for m in means],[m['mean_raw_entropy'] for m in means])
              trunc_fit=fit([np.log(np.sqrt(m['mean_n_sub'])/(4*np.pi)) for m in means],[m['mean_truncated_entropy'] for m in means])
              ratios[str(ratio)]={
                'group_means':means,
                'raw_volume_fit':raw_fit,
                'truncated_log_fit':trunc_fit,
              }

          slopes=[ratios[k]['truncated_log_fit']['slope'] for k in ratios]
          out={
            'test':'BH003_SSEE_H3_HOLDOUT',
            'n_jobs':len(rows),
            'frozen_rule':'lambda_min=sqrt(N)/(4*pi), double parent+subregion truncation',
            'ratios':ratios,
            'transfer_summary':{
              'mean_truncated_log_slope':float(np.mean(slopes)),
              'std_truncated_log_slope_across_ratios':float(np.std(slopes,ddof=1)),
              'max_minus_min_slope':float(max(slopes)-min(slopes)),
            },
            'claim_lock':'H3 nested-ratio holdout only; same background and free-field sector.'
          }
          pathlib.Path('h3_holdout_summary.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(json.dumps(out,indent=2,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: isqgr-causal-set-ssee-h3-summary
          path: h3_holdout_summary.json
          if-no-files-found: error
