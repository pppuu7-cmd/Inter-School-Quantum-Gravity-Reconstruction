name: ISQGR ITER031 corrected-Stage-S bounded contraction

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/isqgr-iter031-corrected-stage-s-bounded-contraction.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lane:
    strategy:
      fail-fast: false
      matrix:
        lane: [authority-domain, component-translation, bounded-contraction, null-controls]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install numerical dependency
        run: python3 -m pip install --user numpy
      - name: Run frozen ITER031 lane
        run: |
          rm -rf out/iter031
          python3 code/iter031/eq27_bounded_contraction_corrected_stage_s.py --lane '${{ matrix.lane }}'
      - name: Preserve evidence
        run: |
          mkdir -p lane_out
          cp out/iter031/evidence.json lane_out/evidence.json
          cat lane_out/evidence.json
      - uses: actions/upload-artifact@v4
        with:
          name: iter031-${{ matrix.lane }}
          path: lane_out/
          if-no-files-found: error
          retention-days: 90

  aggregate:
    needs: lane
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: iter031-*
          path: downloaded_iter031
      - name: Aggregate frozen scientific classes
        run: |
          python3 - <<'PY'
          import glob,json,os
          rows=[]
          for p in sorted(glob.glob('downloaded_iter031/**/evidence.json',recursive=True)):
              with open(p) as f: rows.append(json.load(f))
          by={r.get('lane'):r for r in rows}
          expected=['authority-domain','component-translation','bounded-contraction','null-controls']
          missing=[x for x in expected if x not in by]
          infra=[x for x,r in by.items() if r.get('infrastructure_failure')]
          failed=[x for x,r in by.items() if not r.get('pass',False) and not r.get('infrastructure_failure')]
          if missing or infra:
              classification='NUMERICAL_OR_INFRASTRUCTURE_FAIL_PRE_SCIENCE'
              scientific_pass=False
          elif failed:
              classification='RC006_EQ27_BOUNDED_COMPONENT_CONTRACTION_CORRECTED_STAGE_S_FAIL'
              scientific_pass=False
          else:
              classification='RC006_EQ27_BOUNDED_COMPONENT_CONTRACTION_CORRECTED_STAGE_S_PASS'
              scientific_pass=True
          out={'classification':classification,'scientific_pass':scientific_pass,'lanes':by,'missing':missing,'infrastructure_lanes':infra,'failed_lanes':failed,'claim_locks_preserved':True,'full_eq27_amplitude_claimed':False,'bridge_credit':False}
          os.makedirs('out_iter031_aggregate',exist_ok=True)
          with open('out_iter031_aggregate/aggregate.json','w') as f: json.dump(out,f,indent=2,sort_keys=True)
          print(json.dumps(out,indent=2,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: iter031-aggregate
          path: out_iter031_aggregate/
          if-no-files-found: error
          retention-days: 90
