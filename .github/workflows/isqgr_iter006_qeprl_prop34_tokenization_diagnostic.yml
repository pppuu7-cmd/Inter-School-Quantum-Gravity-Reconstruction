name: ISQGR Iter006 qEPRL Proposition 3.4 Tokenization Diagnostic

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/isqgr_iter006_qeprl_prop34_tokenization_diagnostic.yml'

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - name: Fetch immutable source and PDF
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y poppler-utils >/dev/null
          curl -L --fail --retry 3 -o src.tar https://export.arxiv.org/e-print/1112.2511v1
          echo 'd2dfda1a79b9978422b5a57387f9bbf1ebd4828327c656b59ed74c0acc98302c  src.tar' | sha256sum -c -
          mkdir src && tar -xf src.tar -C src || (cd src && tar -xzf ../src.tar)
          find src -type f -name '*.tex' -print0 | sort -z | xargs -0 cat > source.tex
          curl -L --fail --retry 3 -o paper.pdf https://arxiv.org/pdf/1112.2511v1
          echo 'b41866cdd69defdef1862416bfb40e8b4c39775b53a51718a7cae837fedf6667  paper.pdf' | sha256sum -c -
          pdftotext -layout paper.pdf paper.txt
      - name: Emit exact and canonicalized Proposition neighborhoods
        run: |
          python - <<'PY'
          import pathlib,re,json
          t=pathlib.Path('source.tex').read_text(errors='ignore')
          starts=[m.start() for m in re.finditer(r'\\begin\{proposition\}',t)]
          blocks=[]
          for s in starts:
              e=t.find('\\end{proposition}',s)
              if e>=0:
                  b=t[s:e+len('\\end{proposition}')]
                  if 'braid' in b.lower(): blocks.append(b)
          tex=blocks[0] if len(blocks)==1 else ''
          p=pathlib.Path('paper.txt').read_text(errors='ignore')
          low=' '.join(p.lower().split()); i=low.find('proposition 3.4'); j=low.find('4. the 4-simplex amplitude',i if i>=0 else 0)
          pdf=low[i:(j if j>i else min(len(low),i+3000))] if i>=0 else ''
          out={
            'gate':'ITER006_QEPRL_PROP34_TOKENIZATION_DIAGNOSTIC',
            'scientific_authority':False,
            'tex_exact':tex,
            'tex_alnum_tokens':' '.join(re.sub(r'[^a-z0-9]+',' ',tex.lower()).split()),
            'pdf_exact':pdf,
            'pdf_alnum_tokens':' '.join(re.sub(r'[^a-z0-9α-ω]+',' ',pdf.lower()).split())
          }
          pathlib.Path('diagnostic.json').write_text(json.dumps(out,indent=2,ensure_ascii=False)+'\n')
          print(json.dumps(out,indent=2,ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: prop34-tokenization-diagnostic
          path: diagnostic.json
          if-no-files-found: error
