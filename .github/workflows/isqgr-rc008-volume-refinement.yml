name: ISQGR RC008 Hypercuboid Volume Refinement

on:
  push:
    branches: [main]
    paths:
      - 'experiments/rc008_hypercuboid_volume_refinement.py'
      - '.github/workflows/isqgr-rc008-volume-refinement.yml'
  workflow_dispatch:

permissions: {contents: read}

jobs:
  volume:
    strategy:
      fail-fast: false
      max-parallel: 24
      matrix:
        seed: [101,149,211,257,307,353,401,457,503,557,601,653,701,751,809,853,907,953,1009,1061,1103,1151,1201,1259]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install numpy
      - name: Run frozen Eq4Volume refinement pre-gate
        run: |
          mkdir -p compute_out
          python experiments/rc008_hypercuboid_volume_refinement.py --seed '${{ matrix.seed }}' --output 'compute_out/volume_${{ matrix.seed }}.json'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 'rc008-volume-refinement-${{ matrix.seed }}'
          path: 'compute_out/*.json'
          if-no-files-found: error

  aggregate:
    needs: volume
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: 'rc008-volume-refinement-*'
          path: all
          merge-multiple: true
      - name: Apply frozen aggregate gate
        run: |
          python - <<'PY'
          import glob,json,pathlib,sys
          rows=[json.load(open(f)) for f in sorted(glob.glob('all/*.json'))]
          ok=len(rows)==24 and all(r.get('frozen_gate_pass') for r in rows)
          out={
            'test':'RC008_HYPERCUBOID_VOLUME_REFINEMENT_AGGREGATE',
            'lane_count':len(rows),'passes':sum(bool(r.get('frozen_gate_pass')) for r in rows),
            'frozen_gate_pass':ok,
            'worst_geometry_error':max((r['geometry_relative_error'] for r in rows),default=None),
            'worst_scale_error':max((r['max_scale_relative_error'] for r in rows),default=None),
            'worst_refinement_error':max((r['max_refinement_relative_error'] for r in rows),default=None),
            'minimum_negative_control_shift':min((r['negative_control_relative_shift'] for r in rows),default=None),
            'claim_lock':'Eq:4Volume/refinement prerequisite only; no full amplitude, RG map, held-out bridge or candidate theory claim.'}
          pathlib.Path('summary.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(json.dumps(out,indent=2,sort_keys=True))
          sys.exit(0 if ok else 2)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rc008-volume-refinement-summary
          path: summary.json
          if-no-files-found: error
