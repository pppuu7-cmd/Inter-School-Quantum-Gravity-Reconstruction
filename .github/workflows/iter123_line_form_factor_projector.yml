name: ITER123 line form-factor projector

on:
  push:
    branches: [main]
    paths:
      - 'prereg/ITER123_FIXED_GEODESIC_CURVATURE_DEFECT_LINE_FORM_FACTOR_KINEMATIC_PROJECTOR_2026-09-15.md'
      - 'analysis/iter123_line_form_factor_projector.py'
      - '.github/workflows/iter123_line_form_factor_projector.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  symbolic-projector:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install symbolic dependency
        run: python -m pip install --disable-pip-version-check sympy==1.13.3
      - name: Run ITER123 projector check
        run: python analysis/iter123_line_form_factor_projector.py
      - name: Upload ITER123 outputs
        uses: actions/upload-artifact@v4
        with:
          name: iter123-line-form-factor-projector
          path: artifacts/iter123/
          if-no-files-found: error
