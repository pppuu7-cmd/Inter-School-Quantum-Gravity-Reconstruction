name: ISQGR Iter023 qbar R authority split

on:
  push:
    branches: [main]
    paths:
      - 'code/iter023/**'
      - '.github/workflows/isqgr-iter023-qbar-r-authority.yml'
      - 'triggers/iter023.txt'
  workflow_dispatch:

jobs:
  audit:
    strategy:
      fail-fast: false
      matrix:
        lane: [qbar-inventory, qbar-orientation, r-authority, provenance-null]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'numpy==2.3.3' 'mpmath==1.3.0'
      - run: python code/iter023/qbar_r_authority.py --lane '${{ matrix.lane }}'
      - uses: actions/upload-artifact@v4
        with:
          name: iter023-${{ matrix.lane }}
          path: out/
  aggregate:
    needs: audit
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: iter023-*
          path: lanes
      - run: |
          python - <<'PY'
          import glob,json,os
          ev=[]
          for f in glob.glob('lanes/**/evidence.json',recursive=True):
              try: ev.append(json.load(open(f)))
              except: pass
          expected={'qbar-inventory','qbar-orientation','r-authority','provenance-null'}; by={x.get('lane'):x for x in ev}
          infra=set(by)!=expected or any(x.get('infrastructure_failure') for x in ev)
          if infra: cls='RC006_QBAR_R_INFRASTRUCTURE_PARTIAL'
          elif not by['provenance-null'].get('pass'): cls='RC006_QBAR_R_PROVENANCE_NULL_FAIL'
          elif not by['qbar-inventory'].get('pass') or not by['qbar-orientation'].get('pass'): cls='RC006_QBAR_INDEX_ORDER_BLOCKED'
          elif not by['r-authority'].get('pass'): cls='RC006_R_AUTHORITY_BLOCKED'
          else: cls='RC006_QBAR_R_AUTHORITY_COMPLETE'
          out={'classification':cls,'lane_pass':{k:bool(by.get(k,{}).get('pass')) for k in expected},'bridge_credit':False,'candidate_theory_authorized':False,'new_physics_found':False,'eq29_amplitude_authorized':False,'preferred_alpha_found':False,'iter012_retry_authorized':False,'lanes':ev}
          os.makedirs('aggregate',exist_ok=True); json.dump(out,open('aggregate/aggregate.json','w'),indent=2,sort_keys=True); print(json.dumps(out,indent=2,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: iter023-aggregate
          path: aggregate/aggregate.json
